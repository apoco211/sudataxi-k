  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function getBearing(lat1, lon1, lat2, lon2) {
    const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function isDuplicatePlace(candName, candLat, candLng, existingList) {
    return existingList.some(item => {
      const nameA = item.name.trim();
      const nameB = candName.trim();
      const sameName = nameA === nameB || nameA.includes(nameB) || nameB.includes(nameA);
      const closeDist = getDistanceKm(item.lat, item.lng, candLat, candLng) < 1.2;
      return sameName || closeDist;
    });
  }

    currentMode = mode;

    document.getElementById('btn-mode1').classList.toggle('active', mode === 1);
    document.getElementById('btn-mode2').classList.toggle('active', mode === 2);
    if (currentPos) calculateAndRender();
  }

  async function fetchRealtimeWeather(lat, lng) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=precipitation,rain,showers,snowfall&timezone=Asia%2FTokyo`;
      const res = await fetch(url);
      const data = await res.json();
      const current = data.current || {};
      const isRainOrSnow = (current.precipitation > 0 || current.rain > 0 || current.showers > 0 || current.snowfall > 0);
      return { isRainOrSnow, precip: current.precipitation || 0 };
    } catch (e) {
      return { isRainOrSnow: false, precip: 0 };
    }
  }

  async function fetchOverpassPOIs(lat, lng, radiusMeter) {
    const query = `[out:json][timeout:8];(node(around:${radiusMeter},${lat},${lng})["amenity"~"bar|pub|nightclub|karaoke_box"]["name"];node(around:${radiusMeter},${lat},${lng})["shop"="alcohol"]["name"];);out 40;`;
    try {
      const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
      const data = await res.json();
      return (data.elements || []).map(e => ({
        name: e.tags.name,
        lat: e.lat,
        lng: e.lon,
        amenity: e.tags.amenity || '',
        shop: e.tags.shop || '',
        address: e.tags['addr:full'] || `${e.tags['addr:street'] || ''} ${e.tags['addr:housenumber'] || ''}`.trim() || e.tags.name,
        isWisu: isInsideWisu(e.lat, e.lon)
      }));
    } catch (err) {
      return [];
    }
  }

  function getDynamicTimeCategoryBonus(amenity, shop, nowHour) {
    let bonus = 0;
    const isNightlifePOI = ['bar', 'pub', 'nightclub', 'karaoke_box'].includes(amenity) || shop === 'alcohol';

    if (nowHour >= 21 || nowHour < 2) {
      if (isNightlifePOI) bonus += 35;
      else bonus += 15;
    } else if (nowHour >= 18 && nowHour < 21) {
      if (isNightlifePOI) bonus += 20;
      else bonus += 15;
    } else if (nowHour >= 7 && nowHour < 9) {
      if (['hospital', 'university', 'bus_station'].includes(amenity)) bonus += 20;
      else bonus += 10;
    } else {
      bonus += 5;
    }
    return bonus;
  }

  function calculateCallLogScore(candLat, candLng) {
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    if (logs.length === 0) return { bonus: 0, matched: false };

    const now = new Date();
    const currentHour = now.getHours();
    const currentDay = now.getDay();

    let maxBonus = 0;
    let isMatched = false;

    logs.forEach(log => {
      const dist = getDistanceKm(candLat, candLng, log.lat, log.lng);
      if (dist <= 0.3) {
        const logDate = new Date(log.timestamp);
        const daysPassed = Math.max(0, (now - logDate) / (1000 * 60 * 60 * 24));
        const decayFactor = Math.exp(-0.023 * daysPassed);

        const logHour = logDate.getHours();
        const logDay = logDate.getDay();
        const hourDiff = Math.abs(currentHour - logHour);

        const isHourMatched = (hourDiff <= 1 || hourDiff >= 23);
        const isDayTypeMatched = (currentDay === 0 || currentDay === 6) === (logDay === 0 || logDay === 6);

        let matchMultiplier = 1.0;
        if (isHourMatched) matchMultiplier += 0.5;
        if (isDayTypeMatched) matchMultiplier += 0.3;

        const score = 25 * decayFactor * matchMultiplier;
        if (score > maxBonus) {
          maxBonus = score;
          isMatched = true;
        }
      }
    });

    return { bonus: Math.round(maxBonus), matched: isMatched };
  }

  function executeSearch() {
    const locText = document.getElementById('loc-text');
    locText.innerText = '📍 현재 위치 확인 중...';
    
    if (!navigator.geolocation) {
      alert('GPS를 지원하지 않는 브라우저입니다.');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const inWisu = isInsideWisu(currentPos.lat, currentPos.lng);
        locText.innerText = `📍 ${currentPos.lat.toFixed(4)}, ${currentPos.lng.toFixed(4)} (${inWisu ? '위수 안' : '위수 밖'})`;
        await calculateAndRender();
      },
      (err) => {
        locText.innerText = '📍 GPS 수신 실패 (권한을 확인해 주세요)';
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  async function calculateAndRender() {
    if (!currentPos) return;
    const logEl = document.getElementById('pipeline-log');
    logEl.innerText = '실시간 기상 및 POI 스코어 계산 중...';

    const radius = currentMode === 1 ? 5000 : 10000;
    
    const [overpassData, weatherData] = await Promise.all([
      fetchOverpassPOIs(currentPos.lat, currentPos.lng, radius),
      fetchRealtimeWeather(currentPos.lat, currentPos.lng)
    ]);
    
    let pool = [...overpassData, ...PRESET_HOTSPOTS, ...METRO_ROUTE_HUBS];
    if (currentMode === 1) {
      pool = pool.filter(p => isInsideWisu(p.lat, p.lng));
    }

    let finalTarget = null;
    if (currentMode === 1) {
      let minD = Infinity;
      MAJOR_HUBS.forEach(h => {
        const d = getDistanceKm(currentPos.lat, currentPos.lng, h.lat, h.lng);
        if (d < minD) { minD = d; finalTarget = { ...h, dist: d }; }
      });
    } else {
      const wisuPool = pool.filter(p => isInsideWisu(p.lat, p.lng));
      let minD = Infinity;
      wisuPool.forEach(p => {
        const d = getDistanceKm(currentPos.lat, currentPos.lng, p.lat, p.lng);
        if (d < minD) { minD = d; finalTarget = { ...p, dist: d }; }
      });
      if (!finalTarget) {
        finalTarget = { ...MAJOR_HUBS[0], dist: getDistanceKm(currentPos.lat, currentPos.lng, MAJOR_HUBS[0].lat, MAJOR_HUBS[0].lng) };
      }
    }

    const nowHour = new Date().getHours();
    const finalBearing = getBearing(currentPos.lat, currentPos.lng, finalTarget.lat, finalTarget.lng);

    const scoredPool = pool.map(item => {
      const dist = getDistanceKm(currentPos.lat, currentPos.lng, item.lat, item.lng);
      let score = 50;

      const isMetroHub = METRO_ROUTE_HUBS.some(h => h.name === item.name);
      if (currentMode === 2 && isMetroHub) score += 30;

      score += getDynamicTimeCategoryBonus(item.amenity, item.shop, nowHour);
      if (weatherData.isRainOrSnow) score += 20;

      const logResult = calculateCallLogScore(item.lat, item.lng);
      score += logResult.bonus;

      const itemBearing = getBearing(currentPos.lat, currentPos.lng, item.lat, item.lng);
      const delta = Math.abs(finalBearing - itemBearing);
      if (delta <= 45) score += 30;
      
      if (delta >= 120) {
        if (currentMode === 2 && dist <= 3.0) {
          score -= 10;
        } else {
          score -= 50;
        }
      }

      score -= (dist * 4);

      return { 
        ...item, 
        dist, 
        score: Math.round(score), 
        delta, 
        hasWeatherBonus: weatherData.isRainOrSnow,
        hasLogBonus: logResult.matched,
        isFallback: false
      };
    });

    let selectedRoute = [];
    scoredPool.sort((a, b) => b.score - a.score);

    // 1st Pass: Pick top real hotspots/hubs from pool
    for (let candidate of scoredPool) {
      if (candidate.dist >= finalTarget.dist * 0.95) continue;
      if (getDistanceKm(candidate.lat, candidate.lng, finalTarget.lat, finalTarget.lng) < 0.2) continue;
      
      const isDuplicate = isDuplicatePlace(candidate.name, candidate.lat, candidate.lng, selectedRoute);
      if (!isDuplicate) {
        selectedRoute.push(candidate);
      }
      if (selectedRoute.length === 3) break;
    }

    // 2nd Pass: Fill remaining spots ONLY from real Metro Hubs if available (No fake generic road fallbacks)
    if (selectedRoute.length < 3 && currentMode === 2) {
      const remainingHubs = METRO_ROUTE_HUBS.filter(hub => 
        !isDuplicatePlace(hub.name, hub.lat, hub.lng, selectedRoute)
      ).map(hub => ({
        ...hub,
        dist: getDistanceKm(currentPos.lat, currentPos.lng, hub.lat, hub.lng),
        score: Math.round(65 - getDistanceKm(currentPos.lat, currentPos.lng, hub.lat, hub.lng) * 3),
        delta: Math.abs(finalBearing - getBearing(currentPos.lat, currentPos.lng, hub.lat, hub.lng)),
        isFallback: true
      }));

      remainingHubs.sort((a, b) => b.score - a.score);

      for (let hub of remainingHubs) {
        if (!isDuplicatePlace(hub.name, hub.lat, hub.lng, selectedRoute)) {
          selectedRoute.push(hub);
        }
        if (selectedRoute.length === 3) break;
      }
    }

    selectedRoute.sort((a, b) => a.dist - b.dist);

    currentRouteData = [
      { name: "현재 위치", lat: currentPos.lat, lng: currentPos.lng, isCurrent: true },
      ...selectedRoute,
      { ...finalTarget, isFinal: true }
    ];

    document.getElementById('btn-show-map').style.display = 'flex';

    const weatherText = weatherData.isRainOrSnow ? ' · 비/눈(+20점)' : '';
    logEl.innerText = `방금 · ${radius/1000}km 이내 · ${scoredPool.length}곳 검출${weatherText} · FINAL: ${finalTarget.name}`;

    renderCards(selectedRoute, finalTarget);
  }

  function renderCards(routeCards, finalTarget) {
    const listEl = document.getElementById('card-list');
    listEl.innerHTML = '';

    routeCards.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <div class="card-title-group">
            <div class="num-badge">${index + 1}</div>
            <div>
              <div class="place-name">${item.name}</div>
              <div class="score-dist">${item.dist.toFixed(1)}km · ${item.score}점</div>
            </div>
          </div>
          <button class="navi-btn" onclick="openKakaoNavi('${item.name}', '${item.address || item.name}')">카카오내비</button>
        </div>
        <div class="tag-group">
          ${item.delta <= 45 ? '<span class="tag gilmok">#길목우선</span>' : ''}
          ${item.isWisu ? '<span class="tag wisu">#위수지역</span>' : ''}
          ${item.hasWeatherBonus ? '<span class="tag weather">#강수보너스</span>' : ''}
          ${item.hasLogBonus ? '<span class="tag logmatch">#이력학습</span>' : ''}
          ${item.isFallback ? '<span class="tag fallback">#복귀거점</span>' : ''}
        </div>
      `;
      listEl.appendChild(card);
    });

    const finalCard = document.createElement('div');
    finalCard.className = 'card final-card';
    const targetLabel = currentMode === 1 ? '최종번화가' : '최종위수';
    finalCard.innerHTML = `
      <div class="card-header">
        <div class="card-title-group">
          <div class="num-badge">4</div>
          <div>
            <div class="place-name">${finalTarget.name}</div>
            <div class="score-dist">${finalTarget.dist.toFixed(1)}km · [${targetLabel}]</div>
          </div>
        </div>
        <button class="navi-btn" onclick="openKakaoNavi('${finalTarget.name}', '${finalTarget.address || finalTarget.name}')">카카오내비</button>
      </div>
      <div class="sub-info">
        현재→핫스팟 ${routeCards[0] ? routeCards[0].dist.toFixed(1) : 0}km · ${targetLabel} ${finalTarget.dist.toFixed(1)}km
      </div>
    `;
    listEl.appendChild(finalCard);
  }

  function openRouteMapModal() {
    if (typeof L === 'undefined') {
      alert('지도 인프라(Leaflet) 로딩 중입니다. 잠시 후 다시 시도해 주세요.');
      return;
    }
    if (currentRouteData.length === 0) {
      alert('먼저 [주변 콜 많은 곳 찾기] 버튼을 눌러 위치 검색을 진행해 주세요.');
      return;
    }

    const modal = document.getElementById('map-modal');
    modal.classList.add('active');

    setTimeout(async () => {
      if (!leafletMap) {
        leafletMap = L.map('route-map', { zoomControl: false });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: ''
        }).addTo(leafletMap);
      }
      
      leafletMap.invalidateSize();

      leafletMap.eachLayer(layer => {
        if (layer instanceof L.Marker || layer instanceof L.Polyline) {
          leafletMap.removeLayer(layer);
        }
      });

      const themeColor = currentMode === 1 ? '#FFC800' : '#FF6B00';
      const markerCoords = [];

      currentRouteData.forEach((pt, idx) => {
        const latLng = [pt.lat, pt.lng];
        markerCoords.push(latLng);

        let iconHtml = '';
        if (pt.isCurrent) {
          iconHtml = `<div class="custom-map-marker current">📍</div>`;
        } else if (pt.isFinal) {
          iconHtml = `<div class="custom-map-marker" style="background:${themeColor};">4</div>`;
        } else {
          iconHtml = `<div class="custom-map-marker" style="background:${themeColor};">${idx}</div>`;
        }

        const customIcon = L.divIcon({
          html: iconHtml,
          className: '',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        L.marker(latLng, { icon: customIcon })
          .addTo(leafletMap)
          .bindPopup(`<b>${pt.name}</b>`);
      });

      try {
        const coordsStr = currentRouteData.map(pt => `${pt.lng},${pt.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;
        const res = await fetch(osrmUrl);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          L.polyline(roadCoords, {
            color: themeColor,
            weight: 5,
            opacity: 0.9
          }).addTo(leafletMap);
        } else {
          throw new Error("No OSRM Route");
        }
      } catch (err) {
        L.polyline(markerCoords, {
          color: themeColor,
          weight: 4,
          opacity: 0.85,
          dashArray: '6, 8'
        }).addTo(leafletMap);
      }

      leafletMap.fitBounds(L.latLngBounds(markerCoords), { padding: [50, 50] });
    }, 250);
  }

  function closeRouteMapModal(e) {
    document.getElementById('map-modal').classList.remove('active');
  }

  function openKakaoNavi(name, address) {
    const query = address || name;
    navigator.clipboard.writeText(query);
    alert(`📋 [${query}] 주소가 복사되었습니다.\n카카오내비로 연결합니다.`);
    
    const naviUrl = `kakaonavi://search?q=${encodeURIComponent(query)}`;
    const fallbackUrl = `https://map.kakao.com/link/search/${encodeURIComponent(query)}`;

    const startTime = Date.now();
    window.location.href = naviUrl;

    setTimeout(() => {
      if (Date.now() - startTime < 1500) {
        window.open(fallbackUrl, '_blank');
      }
    }, 1200);
  }

  function saveCurrentCallLocation() {
    if (!currentPos) {
      alert('GPS 위치 확인 후 저장 가능합니다.');
      return;
    }
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    const newLog = {
      timestamp: new Date().toISOString(),
      lat: currentPos.lat,
      lng: currentPos.lng,
      mode: currentMode
    };
    logs.push(newLog);
    localStorage.setItem('sudataxi_call_logs', JSON.stringify(logs));
    alert('🎉 고객 탑승 위치가 성공적으로 저장되었습니다!');
    updateCallLogStats();
  }

  function updateCallLogStats() {
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    const countText = document.getElementById('log-count-text');
    if (countText) {
      countText.innerText = `저장된 기록: ${logs.length}개`;
    }
  }

  function exportCallLogs() {
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    if (logs.length === 0) {
      alert('내보낼 탑승 기록 데이터가 없습니다.');
      return;
    }
    const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    a.href = url;
    a.download = `sudataxi_call_logs_${today}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importCallLogs(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedLogs = JSON.parse(e.target.result);
        if (!Array.isArray(importedLogs)) throw new Error('잘못된 형식입니다.');
        const existingLogs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
        const logMap = new Map();
        [...existingLogs, ...importedLogs].forEach(item => {
          if (item.timestamp) logMap.set(item.timestamp, item);
        });
        const mergedLogs = Array.from(logMap.values());
        localStorage.setItem('sudataxi_call_logs', JSON.stringify(mergedLogs));
        alert(`🎉 기록을 가져왔습니다! (총 ${mergedLogs.length}개)`);
        updateCallLogStats();
      } catch (err) {
        alert('⚠️ 올바른 수다택시 K 백업 JSON 파일이 아닙니다.');
      } finally {
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateCallLogStats();
  });
</script>
