    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: rgba(26,26,26,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--theme-accent); display: flex; align-items: center; gap: 6px; padding: 6px 10px; z-index: 100; max-width: 430px; margin: 0 auto; }

    .timer-display-btn.running { background: #3A2E0A; color: var(--theme-accent); border-color: var(--theme-accent); }

  </style>

<script>
  const KAKAO_REST_KEY = "7ee80d17f027cf99b9634ae13731a6a9";
  
  let currentMode = 1;
  let currentPos = null;
  let leafletMap = null;
  let callMapViewLeaflet = null;
  let currentRouteData = [];
  let timerPresetMin = 5;
  let timerRemainingSec = 300;
  let timerInterval = null;
  let isTimerRunning = false;
  
  let audioCtx = null;
  let silentAudioElement = null;
  const SILENT_WAV_BASE64 = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
  
  function showToast(msg) {
    const t = document.getElementById('toast-banner');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
  }
  function initOrResumeAudioContext() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }
  function startBackgroundAudioKeepAlive() {
    try {
      if (!silentAudioElement) {
        silentAudioElement = new Audio(SILENT_WAV_BASE64);
        silentAudioElement.loop = true;
      }
      silentAudioElement.play().catch(e => {});
    } catch(e) {}

  function stopBackgroundAudioKeepAlive() {

  function playTimerAlarm() {
    try {
      initOrResumeAudioContext();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const beepFreqs = [880, 1050, 1250];
      beepFreqs.forEach((freq, idx) => {
        const startTime = now + (idx * 0.25);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.8, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.2);
      });
    } catch(e) {}
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    triggerSystemNotification();
  }

  function findClosestWisuGateway(currentLat, currentLng) {

    });

  }

  function getStraightDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

      const res = await fetch(url);

  function parseDateSafely(dateStr) {
    if (!dateStr) return new Date(0);
    if (dateStr instanceof Date) return dateStr;
    if (typeof dateStr === 'number') return new Date(dateStr);
    let s = String(dateStr).trim();
    let d = new Date(s);
    if (!isNaN(d.getTime())) return d;
    s = s.replace(' ', 'T');
    d = new Date(s);
    if (!isNaN(d.getTime())) return d;
    return new Date(0);
  }

  /* 💡 OSRM / 카카오 실시간 내비 연동 및 실제 도로 궤적 수신 */
  async function fetchRealRoadRouteDetails(fromLat, fromLng, toLat, toLng) {
    const fallbackDist = getStraightDistanceKm(fromLat, fromLng, toLat, toLng) * 1.3;
    const fallbackResult = {
      distanceKm: fallbackDist,
      durationMin: Math.max(1, Math.round((fallbackDist / 20.0) * 60)),
      geometryCoords: [[fromLat, fromLng], [toLat, toLng]]
    };

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1200);
      const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      
      if (res.ok) {
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const nowHour = new Date().getHours();
          let baseMin = Math.round(route.duration / 60);
          if (nowHour >= 7 && nowHour <= 21) baseMin = Math.round(baseMin * 1.5);
          return {
            distanceKm: route.distance / 1000,
            durationMin: Math.max(1, baseMin),
            geometryCoords: route.geometry.coordinates.map(c => [c[1], c[0]])
          };
        }
      }
    } catch (e) {}

    if (KAKAO_REST_KEY) {
      try {
        const kakaoUrl = `https://apis-naver.kakaomobility.com/v1/directions?origin=${fromLng},${fromLat}&destination=${toLng},${toLat}&priority=RECOMMEND`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(kakaoUrl)}`;
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);
        
        const res = await fetch(proxyUrl, {
          method: 'GET',
          headers: { 'Authorization': `KakaoAK ${KAKAO_REST_KEY}` },
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        if (res.ok) {
          const data = await res.json();
          if (data.routes && data.routes.length > 0 && data.routes[0].result_code === 0) {
            const summary = data.routes[0].summary;
            let geometryCoords = [];
            if (data.routes[0].sections) {
              data.routes[0].sections.forEach(sec => {
                if (sec.roads) {
                  sec.roads.forEach(road => {
                    if (road.vertexes) {
                      for (let i = 0; i < road.vertexes.length; i += 2) {
                        geometryCoords.push([road.vertexes[i+1], road.vertexes[i]]);
                      }
                    }
                  });
                }
              });
            }
            return {
              distanceKm: summary.distance / 1000,
              durationMin: Math.max(1, Math.round(summary.duration / 60)),
              geometryCoords: geometryCoords.length > 0 ? geometryCoords : [[fromLat, fromLng], [toLat, toLng]]
            };
          }
        }
      } catch (e) {}
    }

    return fallbackResult;
  }

  function getDynamicTimeCategoryBonus(itemType, itemName, nowHour) {
    let bonus = 0;
    const type = itemType || '';
    const name = itemName || '';

    const isHospital = type.includes('hospital') || name.includes('병원') || name.includes('메디컬');
    const isAcademy = type.includes('academy') || name.includes('학원') || name.includes('학교');
    const isSubway = type.includes('subway') || name.includes('역') || name.includes('터미널');
    const isNightlife = type.includes('nightlife') || name.includes('먹자골목') || name.includes('포차') || name.includes('주점') || name.includes('로데오');

    if (nowHour >= 7 && nowHour < 12) {
      if (isSubway) bonus += 45;
      if (isHospital) bonus += 40;
      if (isNightlife) bonus -= 20;
    } else if (nowHour >= 12 && nowHour < 18) {
      if (isHospital) bonus += 35;
      if (isAcademy) bonus += 30;
      if (isSubway) bonus += 25;
    } else if (nowHour >= 18 && nowHour < 21) {
      if (isSubway) bonus += 35;
      if (isAcademy) bonus += 35;
      if (isNightlife) bonus += 20;
    } else {
      if (isNightlife) bonus += 45;
      if (isSubway) bonus += 25;
    }

    return bonus;
  }

  function calculateCallLogScore(candLat, candLng) {
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    if (logs.length === 0) return { bonus: 0, matched: false, count: 0, isTimeMatch: false };
    
    const now = new Date();
    const currentHour = now.getHours();
    let maxBonus = 0;
    let isMatched = false;
    let matchCount = 0;
    let isTimeMatch = false;
    logs.forEach(log => {
      const logLat = Number(log.lat);
      const logLng = Number(log.lng);
      if (isNaN(logLat) || isNaN(logLng)) return;
      const dist = getStraightDistanceKm(candLat, candLng, logLat, logLng);
      if (dist <= 0.3) {
        matchCount++;
        const logDate = parseDateSafely(log.timestamp);
        const logHour = logDate.getHours();
        let hourDiff = Math.abs(currentHour - logHour);
        if (hourDiff > 12) hourDiff = 24 - hourDiff;
        let timeBonus = 0;
        if (hourDiff <= 1) {
          timeBonus = 50;
          isTimeMatch = true;
        }
        const daysPassed = Math.max(0, (now - logDate) / (1000 * 60 * 60 * 24));
        const decayFactor = Math.exp(-0.023 * daysPassed);
        const score = (25 + timeBonus) * decayFactor;
        if (score > maxBonus) {
          maxBonus = score;
          isMatched = true;
        }
      }
    });
    return { bonus: Math.round(maxBonus), matched: isMatched, count: matchCount, isTimeMatch };
  }

  /* 장소 중복 체크 (이름 앞 3글자 비교 및 1.2km 이내 거리 체크) */
  function isDuplicatePlace(candName, candLat, candLng, existingList) {
    return existingList.some(item => {
      const nameA = item.name.replace(/\s+/g, '').substring(0, 3);
      const nameB = candName.replace(/\s+/g, '').substring(0, 3);
      const sameName = nameA === nameB || nameA.includes(nameB) || nameB.includes(nameA);
      const closeDist = getStraightDistanceKm(item.lat, item.lng, candLat, candLng) < 1.2;
      return sameName || closeDist;
    });
  }

  /* ⚡ [모드 2 원칙 완벽 구현 엔진] */
  async function calculateAndRender() {
    if (!currentPos) return;
    const logEl = document.getElementById('pipeline-log');
    if (logEl) logEl.innerText = `⚡ [모드 ${currentMode}] 순차 복귀 동선 연산 중...`;
    
    let weatherData = { isRainOrSnow: false };
    try { weatherData = await fetchRealtimeWeather(currentPos.lat, currentPos.lng); } catch(e) {}

    const customHotspots = getCustomHotspots();
    const masterHotspots = getMasterHotspotsFromStorage();
    const nowHour = new Date().getHours();
    
    let finalTarget = null;
    if (currentMode === 1) {
      // [모드 1] 위수 내부: 주요 거점 중 최단거리
      let scoredTargets = await Promise.all(MAJOR_HUBS.map(async h => {
        let road = await fetchRealRoadRouteDetails(currentPos.lat, currentPos.lng, h.lat, h.lng);
        return { ...h, dist: road.distanceKm, estimatedTimeMin: road.durationMin, score: 100, geometryCoords: road.geometryCoords };
      }));
      scoredTargets.sort((a, b) => a.dist - b.dist);
      finalTarget = scoredTargets[0];
    } else {
      // [모드 2] 외곽/복귀: 무조건 '최단 위수 경계 지점'을 최종 목적지로 지정
      const closestGateway = findClosestWisuGateway(currentPos.lat, currentPos.lng);
      let road = await fetchRealRoadRouteDetails(currentPos.lat, currentPos.lng, closestGateway.lat, closestGateway.lng);
      finalTarget = {
        ...closestGateway,
        dist: road.distanceKm,
        estimatedTimeMin: road.durationMin,
        score: Math.max(10, 500 - Math.round(road.distanceKm * 20)),
        geometryCoords: road.geometryCoords
      };
    }

    // 최종 목적지와 명칭이 중복되는 경우 추천 후보군에서 제외
    let rawPool = [...customHotspots, ...masterHotspots].filter(item => {
      const nameA = item.name.replace(/\s+/g, '').substring(0, 3);
      const nameB = finalTarget.name.replace(/\s+/g, '').substring(0, 3);
      return nameA !== nameB;
    });

    const distAtoC = getStraightDistanceKm(currentPos.lat, currentPos.lng, finalTarget.lat, finalTarget.lng);

    // 복귀 길목 방향(진행 방향) 거점만 1차 필터링
    let preFiltered = rawPool.filter(item => {
      const distAtoB = getStraightDistanceKm(currentPos.lat, currentPos.lng, item.lat, item.lng);
      const distBtoC = getStraightDistanceKm(item.lat, item.lng, finalTarget.lat, finalTarget.lng);
      return (distAtoB + distBtoC) <= (distAtoC * 1.35) + 1.5 && distBtoC < distAtoC;
    });

    let scoredPool = await Promise.all(preFiltered.map(async item => {
      const distAtoB = getStraightDistanceKm(currentPos.lat, currentPos.lng, item.lat, item.lng);
      let road = await fetchRealRoadRouteDetails(currentPos.lat, currentPos.lng, item.lat, item.lng);
      
      let isNearStep1 = distAtoB <= 3.0;
      let score = Math.max(10, 350 - Math.round(road.distanceKm * 18));
      if (isNearStep1) score += 140;
      else score += 60;
      if (item.isCustom) score += 50;
      else if (item.region || item.id?.startsWith('hs_')) score += 35;
      
      score += getDynamicTimeCategoryBonus(item.type, item.name, nowHour);
      if (weatherData.isRainOrSnow) score += 20;
      
      const logResult = calculateCallLogScore(item.lat, item.lng);
      score += logResult.bonus;

      return { 
        ...item, 
        dist: road.distanceKm, 
        estimatedTimeMin: road.durationMin,
        geometryCoords: road.geometryCoords,
        score: Math.max(10, score), 
        isNearStep1,
        logCount: logResult.count,
        isTimeMatch: logResult.isTimeMatch,
        isMasterDb: !item.isCustom && (item.region !== undefined || item.id?.startsWith('hs_'))
      };
    }));

    // 점수 높은 거점 필터링
    let validPool = scoredPool.filter(p => p.score >= 20);
    validPool.sort((a, b) => b.score - a.score);

    let selectedCandidates = [];
    let maxCards = currentMode === 1 ? 3 : 2;
    if (distAtoC <= 2.0) maxCards = 0;

    for (let candidate of validPool) {
      if (!isDuplicatePlace(candidate.name, candidate.lat, candidate.lng, selectedCandidates)) {
        selectedCandidates.push(candidate);
      }
      if (selectedCandidates.length === maxCards) break;
    }

    // ⭐ [핵심 복구] 현위치에서 가까운 순서대로 정렬하여 갈지자 꼬임 동선 방지!
    selectedCandidates.sort((a, b) => a.dist - b.dist);

    currentRouteData = [
      { name: "현재 위치", lat: currentPos.lat, lng: currentPos.lng, isCurrent: true },
      ...selectedCandidates,
      { ...finalTarget, isFinal: true }
    ];
    
    const mapBtn = document.getElementById('btn-show-map');
    if (mapBtn) mapBtn.style.display = 'flex';
    if (logEl) {
      logEl.innerText = selectedCandidates.length > 0 
        ? `방금 · 모드 ${currentMode} 복귀 동선 연산 완료 · 추천 거점 ${selectedCandidates.length}곳 제안`
        : `방금 · 모드 ${currentMode} 복귀 동선 연산 완료 · 목적지 근접 (${finalTarget.name} 직행)`;
    }
    
    let subFinalCandidates = [];
    if (currentMode === 1) {
      subFinalCandidates = await Promise.all(MAJOR_HUBS.filter(h => h.name !== finalTarget.name).map(async h => {
        let road = await fetchRealRoadRouteDetails(currentPos.lat, currentPos.lng, h.lat, h.lng);
        return { ...h, dist: road.distanceKm, estimatedTimeMin: road.durationMin, score: 50 };
      }));
      subFinalCandidates.sort((a, b) => a.dist - b.dist);
    }
    renderCards(selectedCandidates, finalTarget, subFinalCandidates);
  }

  function renderCallMapView() {
    if (typeof L === 'undefined') return;
    const centerPos = currentPos || { lat: 37.4048, lng: 126.9767 };
    
    if (!callMapViewLeaflet) {
      callMapViewLeaflet = L.map('call-map-view', { zoomControl: false }).setView([centerPos.lat, centerPos.lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '' }).addTo(callMapViewLeaflet);
    } else {
      callMapViewLeaflet.setView([centerPos.lat, centerPos.lng], 13);
      callMapViewLeaflet.invalidateSize();
    }
    callMapViewLeaflet.eachLayer(l => { if (l instanceof L.Marker) callMapViewLeaflet.removeLayer(l); });
    L.marker([centerPos.lat, centerPos.lng], {
      icon: L.divIcon({ html: '<div class="custom-map-marker current">📍</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
    }).addTo(callMapViewLeaflet).bindPopup('<b>현재 위치</b>');
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    const currentHour = new Date().getHours();
    if (logs.length === 0) {
      document.getElementById('pipeline-log').innerText = '저장된 고객 탑승 콜 기록이 없습니다.';
      return;
    }
    let activeCount = 0;
    logs.forEach(log => {
      const logLat = Number(log.lat);
      const logLng = Number(log.lng);
      if (isNaN(logLat) || isNaN(logLng)) return;
      const logDate = parseDateSafely(log.timestamp);
      const logHour = logDate.getHours();
      let hourDiff = Math.abs(currentHour - logHour);
      if (hourDiff > 12) hourDiff = 24 - hourDiff;
      const isActiveTime = hourDiff <= 1;
      if (isActiveTime) activeCount++;
      const markerClass = isActiveTime ? 'call-dot-marker active-time' : 'call-dot-marker other-time';
      const markerSize = isActiveTime ? 16 : 10;
      L.marker([logLat, logLng], {
        icon: L.divIcon({
          html: `<div class="${markerClass}" style="width:${markerSize}px; height:${markerSize}px;"></div>`,
          className: '',
          iconSize: [markerSize, markerSize],
          iconAnchor: [markerSize/2, markerSize/2]
        })
      }).addTo(callMapViewLeaflet).bindPopup(`
        <b>📍 탑승 기록</b><br>
        시간: ${logDate.toLocaleTimeString()}<br>
        날짜: ${logDate.toLocaleDateString()}<br>
        ${isActiveTime ? '<span style="color:#22C55E; font-weight:900;">🔥 현재시간 집중지점</span>' : ''}
      `);
    });
    document.getElementById('pipeline-log').innerText = `콜 지도 모드 · 전체 ${logs.length}건 중 현재 시간대(${currentHour}시 기준) 콜 ${activeCount}건 집중`;
  }

  /* 🗺️ 실제 도로 곡선 궤적 지도 출력 함수 */
  async function openRouteMapModal() {
    if (typeof L === 'undefined') {
      showToast('지도 로딩 중입니다.');
      return;
    }
    const modal = document.getElementById('map-modal');
    if (modal) modal.classList.add('active');

    setTimeout(async () => {
      if (!leafletMap) {
        leafletMap = L.map('route-map', { zoomControl: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '' }).addTo(leafletMap);
      }
      leafletMap.invalidateSize();
      leafletMap.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.Polyline) leafletMap.removeLayer(l); });
      
      const themeColor = currentMode === 1 ? '#FFC800' : (currentMode === 2 ? '#FF6B00' : '#22C55E');
      const markerCoords = currentRouteData.map(pt => [pt.lat, pt.lng]);
      
      currentRouteData.forEach((pt, idx) => {
        let badgeNum = pt.isFinal ? currentRouteData.length - 1 : idx;
        let html = pt.isCurrent ? '<div class="custom-map-marker current">📍</div>' : `<div class="custom-map-marker" style="background:${themeColor};">${badgeNum}</div>`;
        L.marker([pt.lat, pt.lng], { icon: L.divIcon({ html, className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) })
          .addTo(leafletMap).bindPopup(`<b>${pt.name}</b>`);
      });
      
      let allRoadCoords = [];
      for (let i = 0; i < currentRouteData.length - 1; i++) {
        const start = currentRouteData[i];
        const end = currentRouteData[i+1];
        if (end.geometryCoords && end.geometryCoords.length > 0) {
          allRoadCoords.push(...end.geometryCoords);
        } else {
          try {
            const roadRes = await fetchRealRoadRouteDetails(start.lat, start.lng, end.lat, end.lng);
            if (roadRes && roadRes.geometryCoords && roadRes.geometryCoords.length > 0) {
              allRoadCoords.push(...roadRes.geometryCoords);
            } else {
              allRoadCoords.push([start.lat, start.lng], [end.lat, end.lng]);
            }
          } catch(e) {
            allRoadCoords.push([start.lat, start.lng], [end.lat, end.lng]);
          }
        }
      }

      if (allRoadCoords.length > 0) {
        L.polyline(allRoadCoords, { color: themeColor, weight: 6, opacity: 0.9, lineJoin: 'round' }).addTo(leafletMap);
      }
      leafletMap.fitBounds(L.latLngBounds(markerCoords), { padding: [40, 40] });
    }, 200);
  }

  function cleanQuery(str) {
    if (!str) return '';
    return str.replace(/먹자골목|중심상가|상업지구|환승거점|사거리|로데오거리|로데오|환승센터|포차|맛고을|업무지구|메디컬타운/g, '').trim();
  }

  function copyPlaceName(name, address) {
    let query = address && address !== 'undefined' ? address : cleanQuery(name);
    if (!query) query = name;
    try {
      navigator.clipboard.writeText(query);
    } catch(e) {
      const t = document.createElement('textarea');
      t.value = query;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
    }
    showToast(`📋 [${query}] 명칭 복사완료!`);
  }

  function openKakaoMapRoute(name, lat, lng) {
    let cleanName = cleanQuery(name);
    if (!cleanName) cleanName = name;
    const targetName = encodeURIComponent(cleanName);
    
    const naviAppUrl = `kakaonavi://navigate?name=${targetName}&x=${lng}&y=${lat}`;
    const mapWebUrl = `https://map.kakao.com/link/to/${targetName},${lat},${lng}`;
    const startTime = Date.now();
    window.location.href = naviAppUrl;
    setTimeout(() => {
      if (Date.now() - startTime < 1800) {
        window.location.href = mapWebUrl;
      }
    }, 1200);
  }

  function exportCallLogs() {
    const data = { 
      call_logs: JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]'), 
      custom_hotspots: JSON.parse(localStorage.getItem('sudataxi_custom_hotspots') || '[]'),
      master_hotspots: getMasterHotspotsFromStorage()
    };
    const jsonStr = JSON.stringify(data, null, 2);

    const today = new Date();
    const dateStr = today.getFullYear() +
      String(today.getMonth() + 1).padStart(2, '0') +
      String(today.getDate()).padStart(2, '0');
    
    const defaultFileName = `sudataxi_backup_${dateStr}`;
    let userFileName = prompt('💾 저장할 백업 파일 이름을 입력하세요:', defaultFileName);
    
    if (userFileName === null) return;
    
    userFileName = userFileName.trim();
    if (!userFileName) userFileName = defaultFileName;
    if (!userFileName.endsWith('.json')) userFileName += '.json';

    try {
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const blobUrl = URL.createObjectURL(blob); 
      
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = userFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      showToast(`📥 [${userFileName}] 다운로드 시작!`);
    } catch(e) {
      try {
        navigator.clipboard.writeText(jsonStr);
        showToast('📋 파일 생성 대신 텍스트 복사 완료!');
      } catch(err) {
        showToast('❌ 내보내기에 실패했습니다.');
      }
    }
  }

  function importCallLogs(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const json = JSON.parse(evt.target.result);
        let existingLogs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
        let existingHotspots = JSON.parse(localStorage.getItem('sudataxi_custom_hotspots') || '[]');
        
        let importedLogs = json.call_logs || (Array.isArray(json) ? json : []);
        let importedHotspots = json.custom_hotspots || [];
        let importedMaster = json.master_hotspots || json.hotspots || null;
        
        if (importedMaster && Array.isArray(importedMaster)) {
          localStorage.setItem('sudataxi_master_hotspots', JSON.stringify(importedMaster));
        }
        let logMap = new Map();
        existingLogs.forEach(item => { logMap.set(item.id || `${item.timestamp}_${item.lat}_${item.lng}`, item); });
        importedLogs.forEach(item => { logMap.set(item.id || `${item.timestamp}_${item.lat}_${item.lng}`, item); });
        let mergedLogs = Array.from(logMap.values());
        
        let hotspotMap = new Map();
        existingHotspots.forEach(item => { hotspotMap.set(item.id || `${item.name}_${item.lat}_${item.lng}`, item); });
        importedHotspots.forEach(item => { hotspotMap.set(item.id || `${item.name}_${item.lat}_${item.lng}`, item); });
        let mergedHotspots = Array.from(hotspotMap.values());
        
        localStorage.setItem('sudataxi_call_logs', JSON.stringify(mergedLogs));
        localStorage.setItem('sudataxi_custom_hotspots', JSON.stringify(mergedHotspots));
        updateCallLogStats();
        updateCustomHotspotUI();
        showToast(`🎉 마스터 DB 및 백업 병합 완료!`);
        if (currentMode === 3) renderCallMapView();
        else calculateAndRender();
      } catch(err) {
        showToast('❌ 올바르지 않은 백업/마스터 JSON 파일입니다.');
      } finally {
        e.target.value = '';
      }
    };
    reader.onerror = function() {
      showToast('❌ 파일 읽기 오류가 발생했습니다.');
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  function checkHotspotUpdateReminder() {
    const LAST_UPDATE_KEY = 'suhda_last_hotspot_update';
    const TWO_WEEKS_MS = 14 * 24 * 60 * 60 * 1000;
    
    const lastUpdate = localStorage.getItem(LAST_UPDATE_KEY);
    const now = new Date().getTime();
    if (!lastUpdate) {
      localStorage.setItem(LAST_UPDATE_KEY, now);
    } else if (now - parseInt(lastUpdate, 10) > TWO_WEEKS_MS) {
      const banner = document.getElementById('hotspotUpdateBanner');
      if (banner) banner.style.display = 'block';
    }
  }

  function requestHotspotUpdate() {
    alert("최신 핫플 검색 후 저에게 말씀해 주시면 새로운 마스터 파일을 만들어 드리겠습니다!");
    localStorage.setItem('suhda_last_hotspot_update', new Date().getTime());
    const banner = document.getElementById('hotspotUpdateBanner');
    if (banner) banner.style.display = 'none';
  }

  function dismissBanner() {
    const banner = document.getElementById('hotspotUpdateBanner');
    if (banner) banner.style.display = 'none';
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateCallLogStats();
    updateCustomHotspotUI();
    checkHotspotUpdateReminder();
    
    document.getElementById('btn-mode1').addEventListener('click', () => setMode(1));
    document.getElementById('btn-mode2').addEventListener('click', () => setMode(2));
    document.getElementById('btn-mode3').addEventListener('click', () => setMode(3));
    
    document.getElementById('btn-refresh').addEventListener('click', () => executeSearch());
    document.getElementById('btn-search').addEventListener('click', () => executeSearch());
    document.getElementById('btn-show-map').addEventListener('click', () => openRouteMapModal());
    document.getElementById('map-modal-close').addEventListener('click', () => closeRouteMapModal());
    document.getElementById('map-modal').addEventListener('click', (e) => { if(e.target === e.currentTarget) closeRouteMapModal(); });
    
    document.getElementById('btn-export').addEventListener('click', () => exportCallLogs());
    document.getElementById('btn-import-open').addEventListener('click', () => document.getElementById('import-file-input').click());
    document.getElementById('import-file-input').addEventListener('change', (e) => importCallLogs(e));
    
    document.getElementById('btn-add-custom').addEventListener('click', () => addCustomHotspotPrompt());
    document.getElementById('btn-save-call').addEventListener('click', () => saveCurrentCallLocation());
    
    document.getElementById('timer-btn-5m').addEventListener('click', () => setTimerPreset(5));
    document.getElementById('timer-btn-10m').addEventListener('click', () => setTimerPreset(10));
    document.getElementById('timer-display-btn').addEventListener('click', () => toggleTimer());
    
    setTimeout(() => { executeSearch(); }, 100);
  });
</script>
</body>
</html>
