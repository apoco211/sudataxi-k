<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수다택시 K</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FFC800">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="수다택시K">
  
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="1024x1024" href="./icon-1024.png">
  <link rel="shortcut icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --theme-accent: #FFC800;
      --theme-bg-dark: #2A2210;
      --theme-border: #3A2E0A;
      --theme-text-on-accent: #000000;
      --final-card-bg: #2B2505;
      --final-card-glow: rgba(255, 200, 0, 0.2);
    }
    body.mode-1 {
      --theme-accent: #FFC800;
      --theme-bg-dark: #2A2210;
      --theme-border: #3A2E0A;
      --theme-text-on-accent: #000000;
      --final-card-bg: #2B2505;
      --final-card-glow: rgba(255, 200, 0, 0.2);
    }
    body.mode-2 {
      --theme-accent: #FF6B00;
      --theme-bg-dark: #2A1A0A;
      --theme-border: #3A1F0A;
      --theme-text-on-accent: #FFFFFF;
      --final-card-bg: #2A1A0A;
      --final-card-glow: rgba(255, 107, 0, 0.2);
    }
    body.mode-3 {
      --theme-accent: #22C55E;
      --theme-bg-dark: #0D2418;
      --theme-border: #164E2B;
      --theme-text-on-accent: #000000;
      --final-card-bg: #0B1F14;
      --final-card-glow: rgba(34, 197, 94, 0.25);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121212; color: #FFFFFF; max-width: 430px; margin: 0 auto; padding: 12px 12px 130px 12px; min-height: 100vh; transition: all 0.3s ease; }
    
    .update-banner {
      background-color: #3A2E0A;
      border: 1px solid var(--theme-accent);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #FFD700;
      margin-bottom: 10px;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .banner-content { display: flex; flex-direction: column; gap: 6px; }
    .banner-btns { display: flex; gap: 6px; }
    .btn-update { flex: 1; background-color: var(--theme-accent); color: var(--theme-text-on-accent); border: none; padding: 5px; border-radius: 6px; font-weight: 900; cursor: pointer; font-size: 11px; }
    .btn-close { background-color: #2A2A2A; color: #CCCCCC; border: 1px solid #444; padding: 5px 8px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; }
    .header { text-align: center; font-size: 20px; font-weight: 900; color: var(--theme-accent); margin-bottom: 10px; }
    .mode-container { display: flex; gap: 6px; margin-bottom: 10px; }
    .mode-pill { flex: 1; height: 34px; border-radius: 10px; background: #2A2A2A; color: #8A8A8A; font-size: 12px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
    .mode-pill.active { background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; }
    
    .loc-bar { background: var(--theme-bg-dark); height: 38px; border: 1px solid var(--theme-border); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; color: var(--theme-accent); margin-bottom: 10px; }
    .refresh-btn { background: none; border: none; color: var(--theme-accent); font-size: 15px; cursor: pointer; }
    
    .btn-group-main { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .big-btn { width: 100%; height: 50px; background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; font-size: 16px; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 10px var(--theme-border); }
    .big-btn:active { opacity: 0.9; transform: scale(0.99); }
    
    .map-btn { width: 100%; height: 38px; background: #2A2A2A; color: #FFFFFF; font-size: 13px; font-weight: 800; border: 1px solid var(--theme-border); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    
    .pipeline-log { font-family: monospace; font-size: 11px; color: #8A8A8A; margin: 2px 0 10px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-list { display: flex; flex-direction: column; gap: 8px; }
    .card { background: #1E1E1E; border: 1px solid #2A2A2A; border-radius: 14px; padding: 10px 12px; position: relative; }
    
    .card-main-content { display: flex; flex-direction: column; gap: 6px; }
    .card-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .card-title-group { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; }
    
    .num-badge { width: 24px; height: 24px; border-radius: 50%; background: var(--theme-accent); color: var(--theme-text-on-accent); font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 15px; font-weight: 900; color: #FFFFFF; word-break: keep-all; line-height: 1.25; }
    
    .score-dist { font-size: 12px; font-weight: 800; color: var(--theme-accent); font-family: monospace; margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .level-badge { font-weight: 900; padding: 1px 5px; border-radius: 4px; font-size: 10px; display: inline-flex; align-items: center; gap: 2px; }
    .level-high { background: rgba(74, 222, 128, 0.2); color: #4ADE80; border: 1px solid #4ADE80; }
    .level-mid { background: rgba(255, 200, 0, 0.2); color: #FFC800; border: 1px solid #FFC800; }
    .level-low { background: rgba(255, 107, 107, 0.2); color: #FF6B6B; border: 1px solid #FF6B6B; }
    
    .card-btn-row { display: flex; gap: 6px; margin-top: 2px; }
    .action-btn { flex: 1; height: 34px; font-weight: 800; font-size: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .copy-btn { background: #2C2C2C; color: #CCCCCC; border: 1px solid #444444; }
    .map-open-btn { background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; border: none; }
    
    .tag-group { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #2A2A2A; color: #A0A0A0; }
    .tag.near { background: #1E3A8A; color: #93C5FD; border: 1px solid #3B82F6; font-weight: 700; }
    .tag.wisu { background: var(--theme-bg-dark); color: var(--theme-accent); border: 1px solid var(--theme-border); }
    .tag.custom { background: #3B0764; color: #E9D5FF; border: 1px solid #7E22CE; font-weight: 700; }
    .tag.logmatch { background: #2B1F3D; color: #C084FC; border: 1px solid #5B21B6; font-weight: 700; }
    .tag.timematch { background: #065F46; color: #34D399; border: 1px solid #10B981; font-weight: 800; }
    .tag.masterdb { background: #581C87; color: #F3E8FF; border: 1px solid #9333EA; font-weight: 700; }
    .sub-info { font-size: 11px; color: #8A8A8A; margin-top: 6px; border-top: 1px solid #2A2A2A; padding-top: 6px; }
    
    .card.final-card { background: var(--final-card-bg); border: 1.5px solid var(--theme-accent); box-shadow: 0 0 8px var(--final-card-glow); }
    
    .sub-final-section { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sub-final-title { font-size: 12px; font-weight: 800; color: var(--theme-accent); margin-bottom: 2px; }
    .sub-final-list { display: flex; flex-direction: column; gap: 8px; }
    .sub-final-card { background: #1E1E1E; border: 1px solid #2A2A2A; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .sub-final-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .sub-final-info { flex: 1; min-width: 0; }
    .sub-final-name { font-size: 14px; font-weight: 900; color: #FFFFFF; margin-bottom: 1px; }
    .sub-final-meta { font-size: 11px; font-weight: 800; color: var(--theme-accent); font-family: monospace; }
    .sub-btn-row { display: flex; gap: 6px; margin-top: 2px; padding-top: 6px; border-top: 1px solid #2A2A2A; }
    .sub-action-btn { flex: 1; height: 32px; font-weight: 800; font-size: 11px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .sub-copy-btn { background: #2C2C2C; color: #CCCCCC; border: 1px solid #444444; }
    .sub-map-btn { background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; border: none; }
    #heatmap-container { display: none; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    #call-map-view { width: 100%; height: 340px; background: #1E1E1E; border-radius: 16px; border: 1.5px solid var(--theme-accent); overflow: hidden; }
    .map-legend { display: flex; align-items: center; justify-content: space-between; background: #1E1E1E; padding: 6px 10px; border-radius: 10px; border: 1px solid #2A2A2A; font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-weight: 700; }
    .dot-sample { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .backup-section { margin-top: 14px; background: #1E1E1E; border: 1px solid #2A2A2A; border-radius: 14px; padding: 12px; }
    .backup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .backup-title { font-size: 13px; font-weight: 800; color: var(--theme-accent); }
    .backup-count { font-size: 11px; color: #8A8A8A; }
    .backup-btn-group { display: flex; gap: 6px; }
    .backup-btn { flex: 1; height: 36px; background: #2A2A2A; color: #FFFFFF; font-weight: 800; border: 1px solid #3A3A3A; border-radius: 8px; cursor: pointer; font-size: 12px; }
    
    .custom-section { margin-top: 10px; border-top: 1px dashed #3A3A3A; padding-top: 8px; }
    .add-custom-btn { width: 100%; height: 38px; background: #2A1A3A; color: #D8B4FE; border: 1px solid #6B21A8; font-weight: 800; font-size: 12px; border-radius: 8px; cursor: pointer; }
    
    .recent-log-item { display: flex; align-items: center; justify-content: space-between; background: #242424; border: 1px solid #2E2E2E; border-radius: 6px; padding: 5px 8px; }
    .recent-log-time { font-size: 11px; font-weight: 700; color: #E0E0E0; white-space: nowrap; }
    
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: rgba(26,26,26,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--theme-accent); display: flex; align-items: center; gap: 6px; padding: 6px 10px; z-index: 100; max-width: 430px; margin: 0 auto; }
    .timer-container { flex: 1; height: 100%; display: flex; flex-direction: column; gap: 3px; }
    .timer-mode-selector { display: flex; gap: 3px; height: 18px; }
    .timer-mode-btn { flex: 1; background: #2A2A2A; color: #8A8A8A; font-size: 10px; font-weight: 800; border: 1px solid #3A3A3A; border-radius: 4px; cursor: pointer; }
    .timer-mode-btn.active { background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; border-color: var(--theme-accent) !important; }
    .timer-display-btn { flex: 1; background: #2A2A2A; border: 1px solid #3A3A3A; color: #FFFFFF; font-size: 12px; font-weight: 900; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .timer-display-btn.running { background: #3A2E0A; color: var(--theme-accent); border-color: var(--theme-accent); }
    .timer-display-btn.finished { background: #4A1A1A; color: #FF5555; border-color: #FF5555; animation: alertBlink 1s infinite; }
    
    @keyframes alertBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .save-call-btn { flex: 1; height: 100%; background: var(--theme-accent) !important; color: var(--theme-text-on-accent) !important; font-weight: 900; font-size: 13px; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; word-break: keep-all; }
    
    .map-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
    .map-modal-overlay.active { display: flex; }
    .map-modal-content { width: 100%; max-width: 430px; height: 75vh; background: #1E1E1E; border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 2px solid var(--theme-accent); display: flex; flex-direction: column; overflow: hidden; }
    .map-modal-header { padding: 12px 14px; background: #121212; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2A2A2A; flex-shrink: 0; }
    .map-modal-title { font-size: 15px; font-weight: 800; color: var(--theme-accent); }
    .map-modal-close { background: none; border: none; color: #8A8A8A; font-size: 18px; font-weight: 900; cursor: pointer; }
    #route-map { width: 100%; height: 100%; min-height: 350px; flex: 1; background: #121212; z-index: 1; }
    .leaflet-tile-pane { filter: brightness(1.1) contrast(1.4); }
    .custom-map-marker { width: 30px; height: 30px; border-radius: 50%; background: var(--theme-accent); color: var(--theme-text-on-accent); font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.8); }
    .custom-map-marker.current { background: #22C55E; color: #000000; font-size: 16px; }
    .leaflet-popup-content { font-size: 14px; font-weight: 800; color: #111; }
    .call-dot-marker { border-radius: 50%; border: 2px solid #FFFFFF; box-shadow: 0 0 6px rgba(0,0,0,0.8); }
    .call-dot-marker.active-time { background: #22C55E; animation: activePulseGreen 1.5s infinite; }
    .call-dot-marker.other-time { background: #64748B; opacity: 0.75; }
    @keyframes activePulseGreen {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="mode-1">
  <div id="hotspotUpdateBanner" class="update-banner">
    <div class="banner-content">
      <span>💡 <strong>[수다택시 K]</strong> 핫플 데이터를 검토한 지 2주가 지났어요! 최신 상권을 반영해 볼까요?</span>
      <div class="banner-btns">
        <button onclick="requestHotspotUpdate()" class="btn-update">업데이트 요청하기</button>
        <button onclick="dismissBanner()" class="btn-close">닫기</button>
      </div>
    </div>
  </div>
  <div class="header">주변 콜 많은 곳 찾기</div>
  
  <div class="mode-container">

    <button class="mode-pill" id="btn-mode2">[모드2] 외곽/복귀</button>
    <button class="mode-pill" id="btn-mode3">[콜 지도] 시각화</button>
  </div>
  
  <div class="loc-bar">
    <span id="loc-text">📍 실시간 GPS 위치 수신 대기 중...</span>
    <button class="refresh-btn" id="btn-refresh">⟳</button>
  </div>
  
  <div class="btn-group-main" id="main-btn-group">
    <button class="big-btn" id="btn-search">
      <span>📍 주변 콜 많은 곳 찾기</span>
    </button>
    <button class="map-btn" id="btn-show-map" style="display: none;">

      <div id="recent-logs-list" style="display: flex; flex-direction: column; gap: 3px;"></div>
    </div>
    
    <div class="custom-section">
      <button class="add-custom-btn" id="btn-add-custom">⭐ 현재 위치를 '나만의 콜 장소'로 직접 등록</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let currentMode = 1;
  let currentPos = null;
  let leafletMap = null;
  let callMapViewLeaflet = null;
  let currentRouteData = [];
  let timerPresetMin = 5;
  let timerRemainingSec = 300;
  let timerInterval = null;
  let isTimerRunning = false;
  
  let audioCtx = null;
  let silentAudioElement = null;
  const SILENT_WAV_BASE64 = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
  
  function showToast(msg) {
    const t = document.getElementById('toast-banner');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
  }
  function initOrResumeAudioContext() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }
  function startBackgroundAudioKeepAlive() {
    try {
      if (!silentAudioElement) {
        silentAudioElement = new Audio(SILENT_WAV_BASE64);
        silentAudioElement.loop = true;
      }
      silentAudioElement.play().catch(e => {});
    } catch(e) {}

  function stopBackgroundAudioKeepAlive() {

  function getStraightDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);

  function extractPathWaypointsEvery5km(geometryCoords, intervalKm = 5.0) {
    if (!geometryCoords || geometryCoords.length < 2) return [];

    let accumulatedKm = 0;
    let nextTargetKm = intervalKm;
    for (let i = 0; i < geometryCoords.length - 1; i++) {
      const p1 = geometryCoords[i];
      const p2 = geometryCoords[i+1];
      const segDist = getStraightDistanceKm(p1[0], p1[1], p2[0], p2[1]);
      while (accumulatedKm + segDist >= nextTargetKm) {
        const ratio = (nextTargetKm - accumulatedKm) / segDist;
        const lat = p1[0] + ratio * (p2[0] - p1[0]);
        const lng = p1[1] + ratio * (p2[1] - p1[1]);
        waypoints.push({ lat, lng, kmOffset: nextTargetKm });
        nextTargetKm += intervalKm;
      }
      accumulatedKm += segDist;
    }
    return waypoints;
  }

    if (dateStr instanceof Date) return dateStr;
    if (typeof dateStr === 'number') return new Date(dateStr);
    let s = String(dateStr).trim();
    let d = new Date(s);
    if (!isNaN(d.getTime())) return d;
    s = s.replace(' ', 'T');
    d = new Date(s);
    if (!isNaN(d.getTime())) return d;
    return new Date(0);
  }

      if (isNightlife) bonus += 40;

      if (isCommuteHub) bonus += 35;

  function calculateCallLogScore(candLat, candLng) {
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    if (logs.length === 0) return { bonus: 0, matched: false, count: 0, isTimeMatch: false };
    
    const now = new Date();
    const currentHour = now.getHours();
    let maxBonus = 0;
    let isMatched = false;
    let matchCount = 0;
    let isTimeMatch = false;
    logs.forEach(log => {
      const logLat = Number(log.lat);
      const logLng = Number(log.lng);
      if (isNaN(logLat) || isNaN(logLng)) return;
      const dist = getStraightDistanceKm(candLat, candLng, logLat, logLng);
      if (dist <= 0.3) {
        matchCount++;
        const logDate = parseDateSafely(log.timestamp);
        const logHour = logDate.getHours();
        let hourDiff = Math.abs(currentHour - logHour);
        if (hourDiff > 12) hourDiff = 24 - hourDiff;
        let timeBonus = 0;
        if (hourDiff <= 1) {
          timeBonus = 50;
          isTimeMatch = true;
        }
        const daysPassed = Math.max(0, (now - logDate) / (1000 * 60 * 60 * 24));
        const decayFactor = Math.exp(-0.023 * daysPassed);
        const score = (25 + timeBonus) * decayFactor;
        if (score > maxBonus) {
          maxBonus = score;
          isMatched = true;
        }
      }
    });
    return { bonus: Math.round(maxBonus), matched: isMatched, count: matchCount, isTimeMatch };
  }

        score: Math.max(10, score),

        logCount: logResult.count,
        isTimeMatch: logResult.isTimeMatch,
        isMasterDb: !item.isCustom && (item.region !== undefined || item.id?.startsWith('hs_'))
      };
    }));
    let selectedRoute = [];
    let validPool = scoredPool.filter(p => p.score >= 35 && p.name !== finalTarget.name);
    
    validPool.sort((a, b) => a.dist - b.dist);
    let maxCards = currentMode === 1 ? 3 : 2;
    if (distAtoC <= 1.5) {
      maxCards = 0;
    } else if (distAtoC <= 4.0) {
      maxCards = 1;
    }
    for (let candidate of validPool) {
      if (!isDuplicatePlace(candidate.name, candidate.lat, candidate.lng, selectedRoute)) {
        selectedRoute.push(candidate);
      }
      if (selectedRoute.length === maxCards) break;
    }
    currentRouteData = [
      { name: "현재 위치", lat: currentPos.lat, lng: currentPos.lng, isCurrent: true },
      ...selectedRoute,
      { ...finalTarget, isFinal: true }
    ];
    
    const mapBtn = document.getElementById('btn-show-map');
    if (mapBtn) mapBtn.style.display = 'flex';
    if (logEl) {
      logEl.innerText = selectedRoute.length > 0 
        ? `방금 · 모드 ${currentMode} 연산 완료 · 사이 경로상 핫플 ${selectedRoute.length}곳 제안`
        : `방금 · 모드 ${currentMode} 연산 완료 · 목적지 근접 (${finalTarget.name} 직행)`;
    }
    
    let subFinalCandidates = [];
    if (currentMode === 1) {
      subFinalCandidates = MAJOR_HUBS.filter(h => h.name !== finalTarget.name).map(h => {
        return { ...h, dist: getStraightDistanceKm(currentPos.lat, currentPos.lng, h.lat, h.lng), estimatedTimeMin: 5, score: 50 };
      });
      subFinalCandidates.sort((a, b) => a.dist - b.dist);
    }
    renderCards(selectedRoute, finalTarget, subFinalCandidates);
  }

  function renderCallMapView() {
    if (typeof L === 'undefined') return;
    const centerPos = currentPos || { lat: 37.4048, lng: 126.9767 };
    
    if (!callMapViewLeaflet) {
      callMapViewLeaflet = L.map('call-map-view', { zoomControl: false }).setView([centerPos.lat, centerPos.lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '' }).addTo(callMapViewLeaflet);
    } else {
      callMapViewLeaflet.setView([centerPos.lat, centerPos.lng], 13);
      callMapViewLeaflet.invalidateSize();
    }
    callMapViewLeaflet.eachLayer(l => { if (l instanceof L.Marker) callMapViewLeaflet.removeLayer(l); });
    L.marker([centerPos.lat, centerPos.lng], {
      icon: L.divIcon({ html: '<div class="custom-map-marker current">📍</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
    }).addTo(callMapViewLeaflet).bindPopup('<b>현재 위치</b>');
    const logs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
    const currentHour = new Date().getHours();
    if (logs.length === 0) {
      document.getElementById('pipeline-log').innerText = '저장된 고객 탑승 콜 기록이 없습니다.';
      return;
    }
    let activeCount = 0;
    logs.forEach(log => {
      const logLat = Number(log.lat);
      const logLng = Number(log.lng);
      if (isNaN(logLat) || isNaN(logLng)) return;
      const logDate = parseDateSafely(log.timestamp);
      const logHour = logDate.getHours();
      let hourDiff = Math.abs(currentHour - logHour);
      if (hourDiff > 12) hourDiff = 24 - hourDiff;
      const isActiveTime = hourDiff <= 1;
      if (isActiveTime) activeCount++;
      const markerClass = isActiveTime ? 'call-dot-marker active-time' : 'call-dot-marker other-time';
      const markerSize = isActiveTime ? 16 : 10;
      L.marker([logLat, logLng], {
        icon: L.divIcon({
          html: `<div class="${markerClass}" style="width:${markerSize}px; height:${markerSize}px;"></div>`,
          className: '',
          iconSize: [markerSize, markerSize],
          iconAnchor: [markerSize/2, markerSize/2]
        })
      }).addTo(callMapViewLeaflet).bindPopup(`
        <b>📍 탑승 기록</b><br>
        시간: ${logDate.toLocaleTimeString()}<br>
        날짜: ${logDate.toLocaleDateString()}<br>
        ${isActiveTime ? '<span style="color:#22C55E; font-weight:900;">🔥 현재시간 집중지점</span>' : ''}
      `);
    });
    document.getElementById('pipeline-log').innerText = `콜 지도 모드 · 전체 ${logs.length}건 중 현재 시간대(${currentHour}시 기준) 콜 ${activeCount}건 집중`;
  }
  async function openRouteMapModal() {
    if (typeof L === 'undefined') {
      showToast('지도 로딩 중입니다.');
      return;
    }
    const modal = document.getElementById('map-modal');
    if (modal) modal.classList.add('active');
    setTimeout(async () => {
      if (!leafletMap) {
        leafletMap = L.map('route-map', { zoomControl: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '' }).addTo(leafletMap);
      }
      leafletMap.invalidateSize();
      leafletMap.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.Polyline) leafletMap.removeLayer(l); });
      
      const themeColor = currentMode === 1 ? '#FFC800' : (currentMode === 2 ? '#FF6B00' : '#22C55E');
      const markerCoords = currentRouteData.map(pt => [pt.lat, pt.lng]);
      
      currentRouteData.forEach((pt, idx) => {
        let badgeNum = pt.isFinal ? currentRouteData.length - 1 : idx;
        let html = pt.isCurrent ? '<div class="custom-map-marker current">📍</div>' : `<div class="custom-map-marker" style="background:${themeColor};">${badgeNum}</div>`;
        L.marker([pt.lat, pt.lng], { icon: L.divIcon({ html, className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) })
          .addTo(leafletMap).bindPopup(`<b>${pt.name}</b>`);
      });
      try {
        const coordsStr = currentRouteData.map(pt => `${pt.lng},${pt.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;
        const res = await fetch(osrmUrl);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          L.polyline(roadCoords, { color: themeColor, weight: 6, opacity: 0.95 }).addTo(leafletMap);
        } else {
          throw new Error("No OSRM Route");
        }
      } catch (err) {
        L.polyline(markerCoords, { color: themeColor, weight: 5, opacity: 0.9, dashArray: '6, 8' }).addTo(leafletMap);
      }
      leafletMap.fitBounds(L.latLngBounds(markerCoords), { padding: [40, 40] });
    }, 200);
  }

  function cleanQuery(str) {
    if (!str) return '';
    return str.replace(/먹자골목|중심상가|상업지구|환승거점|사거리|로데오거리|로데오|환승센터|포차|맛고을|업무지구/g, '').trim();
  }
  function copyPlaceName(name, address) {
    let query = address && address !== 'undefined' ? address : cleanQuery(name);
    if (!query) query = name;
    try {
      navigator.clipboard.writeText(query);
    } catch(e) {
      const t = document.createElement('textarea');
      t.value = query;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
    }
    showToast(`📋 [${query}] 명칭 복사완료!`);
  }
  function openKakaoMapRoute(name, lat, lng) {
    let cleanName = cleanQuery(name);
    if (!cleanName) cleanName = name;
    const targetName = encodeURIComponent(cleanName);
    
    const naviAppUrl = `kakaonavi://navigate?name=${targetName}&x=${lng}&y=${lat}`;
    const mapWebUrl = `https://map.kakao.com/link/to/${targetName},${lat},${lng}`;
    const startTime = Date.now();
    window.location.href = naviAppUrl;
    setTimeout(() => {
      if (Date.now() - startTime < 1800) {
        window.location.href = mapWebUrl;
      }
    }, 1200);
  }

  // 🌟 [수정 완료] 모바일/스마트폰 다운로드 동작을 완벽하게 수정한 내보내기 함수
  function exportCallLogs() {
    const data = { 
      call_logs: JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]'), 
      custom_hotspots: JSON.parse(localStorage.getItem('sudataxi_custom_hotspots') || '[]'),
      master_hotspots: getMasterHotspotsFromStorage()
    };
    const jsonStr = JSON.stringify(data, null, 2);

    try {
      const blob = new Blob([jsonStr], { type: 'application/json' });
      // 💡 URL.createElement 오타 수정 -> URL.createObjectURL 정상 적용
      const blobUrl = URL.createObjectURL(blob); 
      
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `sudataxi_backup_${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      // 메모리 해제
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      showToast('📥 백업 파일 다운로드가 시작되었습니다!');
    } catch(e) {
      // 만약의 파일 다운로드 차단 시 클립보드 복사 대체
      try {
        navigator.clipboard.writeText(jsonStr);
        showToast('📋 파일 생성 대신 텍스트 복사 완료!');
      } catch(err) {
        showToast('❌ 내보내기에 실패했습니다.');
      }
    }
  }

  function importCallLogs(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const json = JSON.parse(evt.target.result);
        let existingLogs = JSON.parse(localStorage.getItem('sudataxi_call_logs') || '[]');
        let existingHotspots = JSON.parse(localStorage.getItem('sudataxi_custom_hotspots') || '[]');
        
        let importedLogs = json.call_logs || (Array.isArray(json) ? json : []);
        let importedHotspots = json.custom_hotspots || [];
        let importedMaster = json.master_hotspots || json.hotspots || null;
        
        if (importedMaster && Array.isArray(importedMaster)) {
          localStorage.setItem('sudataxi_master_hotspots', JSON.stringify(importedMaster));
        }
        let logMap = new Map();
        existingLogs.forEach(item => { logMap.set(item.id || `${item.timestamp}_${item.lat}_${item.lng}`, item); });
        importedLogs.forEach(item => { logMap.set(item.id || `${item.timestamp}_${item.lat}_${item.lng}`, item); });
        let mergedLogs = Array.from(logMap.values());
        
        let hotspotMap = new Map();
        existingHotspots.forEach(item => { hotspotMap.set(item.id || `${item.name}_${item.lat}_${item.lng}`, item); });
        importedHotspots.forEach(item => { hotspotMap.set(item.id || `${item.name}_${item.lat}_${item.lng}`, item); });
        let mergedHotspots = Array.from(hotspotMap.values());
        
        localStorage.setItem('sudataxi_call_logs', JSON.stringify(mergedLogs));
        localStorage.setItem('sudataxi_custom_hotspots', JSON.stringify(mergedHotspots));
        updateCallLogStats();
        updateCustomHotspotUI();
        showToast(`🎉 마스터 DB 및 백업 병합 완료!`);
        if (currentMode === 3) renderCallMapView();
        else calculateAndRender();
      } catch(err) {
        showToast('❌ 올바르지 않은 백업/마스터 JSON 파일입니다.');
      } finally {
        e.target.value = '';
      }
    };
    reader.onerror = function() {
      showToast('❌ 파일 읽기 오류가 발생했습니다.');
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  }
  function dismissBanner() {
    const banner = document.getElementById('hotspotUpdateBanner');
    if (banner) banner.style.display = 'none';
  }
  window.addEventListener('DOMContentLoaded', () => {
    updateCallLogStats();
    updateCustomHotspotUI();
    checkHotspotUpdateReminder();
    document.getElementById('btn-mode1').addEventListener('click', () => setMode(1));
    document.getElementById('btn-mode2').addEventListener('click', () => setMode(2));
    document.getElementById('btn-mode3').addEventListener('click', () => setMode(3));
    document.getElementById('btn-refresh').addEventListener('click', () => executeSearch());
    document.getElementById('btn-search').addEventListener('click', () => executeSearch());
    document.getElementById('btn-show-map').addEventListener('click', () => openRouteMapModal());
    document.getElementById('map-modal-close').addEventListener('click', () => closeRouteMapModal());
    document.getElementById('map-modal').addEventListener('click', (e) => { if(e.target === e.currentTarget) closeRouteMapModal(); });
    document.getElementById('btn-export').addEventListener('click', () => exportCallLogs());
    document.getElementById('btn-import-open').addEventListener('click', () => document.getElementById('import-file-input').click());
    document.getElementById('import-file-input').addEventListener('change', (e) => importCallLogs(e));
    document.getElementById('btn-add-custom').addEventListener('click', () => addCustomHotspotPrompt());
    document.getElementById('btn-save-call').addEventListener('click', () => saveCurrentCallLocation());
    document.getElementById('timer-btn-5m').addEventListener('click', () => setTimerPreset(5));
    document.getElementById('timer-btn-10m').addEventListener('click', () => setTimerPreset(10));
    document.getElementById('timer-display-btn').addEventListener('click', () => toggleTimer());
    setTimeout(() => { executeSearch(); }, 100);
  });
</script>
</body>
</html>
