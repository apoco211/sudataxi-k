function isInsideWisu(lat,lng){
if(lat>=37.38&&lat<=37.43&&lng>=126.90&&lng<=126.96) return true;
if(lat>=37.33&&lat<=37.38&&lng>=126.90&&lng<=126.96) return true;
if(lat>=37.32&&lat<=37.38&&lng>=126.93&&lng<=126.99) return true;
if(lat>=37.41&&lat<=37.45&&lng>=126.97&&lng<=127.03) return true;
return false;
}
function hav(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bearing(a,b){const dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,y=Math.sin(dLng)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLng);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
let cur=null;let mode=1;let callLogs=JSON.parse(localStorage.getItem('callLogs')||'[]');let lastList=[];
function updateLocBar(){const el=document.getElementById('loc');if(!cur){el.textContent='📍 GPS 대기 중 - 아래 버튼을 눌러 위치 확인';return;}const inside=isInsideWisu(cur.lat,cur.lng)?'위수 안':'위수 밖';el.textContent=`📍 ${cur.lat.toFixed(4)},${cur.lng.toFixed(4)} · ${inside} · ±${Math.round(cur.acc)}m`;}

function timeBonus(){const h=new Date().getHours(),d=new Date().getDay();let b=0;if(h>=17&&h<=20)b+=25;if(h>=18&&h<=22)b+=15;if(h>=22||h<=2)b+=20;if(d==5||d==6)b+=10;return b;}
async function fetchOverpass(radius){const q=`[out:json][timeout:12];node(around:${radius},${cur.lat},${cur.lng})[amenity~"bar|pub|nightclub|karaoke_box"];out 20;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});const j=await r.json();return (j.elements||[]).map(e=>({name:e.tags.name||e.tags.amenity||'술집',lat:e.lat,lng:e.lon,addr:'실시간',src:'real'}));}catch(e){return [];}}
function scoreCandidate(c,finalDest){let s=50;s+=timeBonus();if(callLogs.some(l=>hav(c,l)<0.3)) s+=20;if(isInsideWisu(c.lat,c.lng)) s+=10;const delta=Math.abs(bearing(cur,finalDest)-bearing(cur,c));const d2=delta>180?360-delta:delta;if(d2<=45) s+=30;else if(d2>=120) s-=50;s-=hav(cur,c)*4;s+=Math.random()*3;return {...c, score:s, dist:hav(cur,c), delta:d2, finalDist:hav(cur,finalDest)};}
function openKakaoMap(idx){const c=lastList[idx];if(!c) return;const addr=c.addr&&c.addr!=='실시간'?c.addr:c.name;const safeName=encodeURIComponent(c.name);const safeAddr=encodeURIComponent(addr);navigator.clipboard.writeText(addr).catch(()=>{});if(c.addr&&c.addr!=='실시간'){window.open(`https://map.kakao.com/link/search/${safeAddr}`,'_blank');setTimeout(()=>{location.href=`kakaonavi://navigate?name=${safeName}&x=${c.lng}&y=${c.lat}&coord_type=wgs84&rp_option=2`;},400);}else{window.open(`https://map.kakao.com/link/to/${safeName},${c.lat},${c.lng}`,'_blank');setTimeout(()=>{location.href=`kakaonavi://navigate?name=${safeName}&x=${c.lng}&y=${c.lat}&coord_type=wgs84&rp_option=2`;},400);}}
function render(list,finalDest){lastList=list;const el=document.getElementById('list');el.innerHTML='';list.forEach((c,i)=>{const isFinal=i===list.length-1;const div=document.createElement('div');div.className='card '+(isFinal?(mode==1?'final1':'final2'):'');const badges=[];if(c.delta<=45) badges.push('<span class="badge b-gil">길목 +30</span>');if(isInsideWisu(c.lat,c.lng)) badges.push('<span class="badge b-wisu">위수 +10</span>');if(callLogs.some(l=>hav(c,l)<0.3)) badges.push('<span class="badge b-log">로그 +20</span>');const remain=finalDest?(finalDest.dist-c.dist).toFixed(1):'0';const distLine=mode==1?`현재→핫스팟 ${c.dist.toFixed(2)}km · 최종 ${finalDest.dist.toFixed(2)}km`:`현재→핫스팟 ${c.dist.toFixed(2)}km · 최종위수 ${finalDest.dist.toFixed(2)}km (${finalDest.name}까지 ${remain}km 남음)`;div.innerHTML=`<div style="display:flex;gap:10px;flex:1"><div class="num">${isFinal?'★':i+1}</div><div style="flex:1"><div class="name">${c.name}</div><div class="meta">${c.dist.toFixed(2)}km · ${Math.round(c.score)}점</div><div class="addr">${distLine}</div><div class="addr">${c.addr||''}</div><div class="coord">${c.lat.toFixed(4)},${c.lng.toFixed(4)}</div><div>${badges.join('')}</div></div></div><button class="btn" onclick="openKakaoMap(${i})">[네비게이션]</button>`;el.appendChild(div);});}
async function searchNow(){const locEl=document.getElementById('loc');locEl.textContent='📍 현재 위치 확인 중...';try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000,maximumAge:0}));cur={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};}catch(e){alert('GPS 실패 - 위치 권한 확인');document.getElementById('loc').textContent='📍 GPS 실패 - 다시 시도';return;}updateLocBar();const radius=mode==1?3000:10000;let real=[];try{real=await fetchOverpass(radius);}catch{}const all=[...FIXED,...real.map(r=>({...r,addr:'실시간'}))];let finalDest;if(mode==1){let best=null
