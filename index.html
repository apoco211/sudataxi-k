<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수다택시 K v60.4</title>
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json?v=60.4">
<meta name="theme-color" content="#FFC800">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
.card{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:20px;padding:14px}
.final{background:#2B2505;border:1px solid #FFC800;box-shadow:0 0 14px rgba(255,200,0,.18)}
.btn-yellow{background:#FFC800;color:#121212;font-weight:900}
.btn-gray{background:#2A2A2A;color:#8A8A8A}
.pill{border-radius:12px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:1}
</style>
</head>
<body class="p-3 pb-28">
<div class="max-w-[430px] mx-auto">
  <div class="flex justify-between items-center mb-3">
    <h1 class="text-[#FFC800] text-[22px] font-black">주변 콜 많은 곳 찾기</h1>
    <span class="bg-[#1E1E1E] border border-[#2A2A2A] text-[#666] text-[11px] px-2.5 py-1 rounded-full font-mono">수다택시 K v60.4</span>
  </div>
  <div class="flex gap-2.5 mb-3">
    <button id="mode1" class="pill btn-yellow">모드1 위수지역</button>
    <button id="mode2" class="pill btn-gray">모드2 복귀경로</button>
  </div>
  <div id="locBar" class="bg-[#2A2210] border border-[#3A2E0A] rounded-xl h-11 flex items-center px-3 text-[13px] font-mono text-[#FFC800] mb-3">📍 위치 확인 중...</div>
  <button id="searchBtn" class="w-full h-[72px] rounded-[20px] btn-yellow text-[19px] shadow-[0_6px_20px_rgba(255,200,0,.25)] mb-2">📍 주변 콜 많은 곳 찾기</button>
  <div id="pipeline" class="text-[11px] font-mono text-[#666] mb-3">대기 중 · 모드2는 위수 안 최고점수가 FINAL</div>
  <div class="flex items-center justify-between mb-3">
    <span class="font-black text-[18px]">🔥 TOP3</span>
    <span id="timeBadge" class="text-[11px] bg-[#1E1E1E] border border-[#2A2A2A] px-2.5 py-1 rounded-full text-[#777]"></span>
  </div>
  <div id="cards" class="flex flex-col gap-3"></div>
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#2A2A2A] text-white px-5 py-2.5 rounded-full text-[13px] font-bold hidden z-50"></div>
  <div class="fixed bottom-0 left-0 right-0 p-3 bg-[#121212]/95 backdrop-blur border-t border-[#2A2A2A]"><div class="max-w-[430px] mx-auto"><button id="saveBtn" class="w-full h-[64px] rounded-[16px] btn-yellow text-[16px]">📍 현재 위치를 탑승장소로 저장</button></div></div>
</div>
<script>
const FIXED=[
 {name:'평촌역 먹자골목',lat:37.3905,lng:126.925,addr:'안양시 동안구 시민대로 200',type:'station',base:88},
 {name:'범계역 로데오거리',lat:37.391, lng:126.914, addr:'안양시 동안구 평촌대로 130',type:'station',base:90},
 {name:'산본역 중심상가',lat:37.356, lng:126.9335,addr:'군포시 산본로 336',type:'station',base:80},
 {name:'인덕원역 4번출구',lat:37.405, lng:126.976, addr:'안양시 동안구 인덕원로 159',type:'station',base:82},
 {name:'금정역',lat:37.3725,lng:126.944, addr:'군포시 금정동 710',type:'station',base:78},
 {name:'롯데백화점 평촌점',lat:37.389, lng:126.923, addr:'안양시 동안구 시민대로 180',type:'mart',base:86},
 {name:'홈플러스 안양점',lat:37.398, lng:126.926, addr:'안양시 만안구 안양로 303',type:'mart',base:76},
 {name:'이마트 산본점',lat:37.3565,lng:126.929, addr:'군포시 번영로 90',type:'mart',base:74},
 {name:'한림대 평촌성심병원',lat:37.3925,lng:126.9275,addr:'안양시 동안구 관평로 170번길 22',type:'hospital',base:92},
 {name:'안양샘병원',lat:37.401, lng:126.921, addr:'안양시 만안구 삼덕로 9',type:'hospital',base:84},
 {name:'평촌 더샵',lat:37.3895,lng:126.924, addr:'안양시 동안구 평촌대로 40번길',type:'apartment',base:72},
 {name:'산본 래미안',lat:37.3555,lng:126.9345,addr:'군포시 산본로 386번길',type:'apartment',base:70},
 {name:'안양시청',lat:37.394, lng:126.919, addr:'안양시 동안구 시민대로 235',type:'office',base:76},
 {name:'군포시청',lat:37.361, lng:126.926, addr:'군포시 청백리길 6',type:'office',base:72}
];
function isInsideWisu(a,b){return (a>=37.38&&a<=37.44&&b>=126.90&&b<=126.97)||(a>=37.33&&a<=37.40&&b>=126.90&&b<=126.98)||(a>=37.32&&a<=37.41&&b>=126.93&&b<=127.00)||(a>=37.40&&a<=37.49&&b>=126.96&&b<=127.07);}
function hav(a,b,c,d){const R=6371;const dLa=(c-a)*Math.PI/180;const dLn=(d-b)*Math.PI/180;const x=Math.sin(dLa/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bearing(a,b,c,d){const y=Math.sin((d-b)*Math.PI/180)*Math.cos(c*Math.PI/180);const x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos((d-b)*Math.PI/180);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
let cur={lat:37.5014,lng:127.0367,mode:2,time:Date.now()};
function getBonus(t,h){
 if(h>=5&&h<10){if(['station','bus','hospital','mart','apartment','office'].includes(t))return 25; if(['bar','pub','karaoke','nightclub'].includes(t))return -100;}
 if(h>=10&&h<16){if(t==='hospital')return 25; if(t==='mart')return 20; if(['apartment','office','station'].includes(t))return 15; if(t==='bus')return 10; if(['bar','pub','karaoke','nightclub'].includes(t))return -100;}
 if(h>=16&&h<20){if(t==='station')return 25; if(['mart','apartment'].includes(t))return 15;}
 if(h>=20&&h<22){if(['bar','pub'].includes(t))return 15; if(t==='karaoke')return 10; if(t==='station')return 15;}
 if(h>=22||h<2){if(['bar','pub','nightclub','karaoke'].includes(t))return 25; if(t==='station')return 15;}
 if(h>=2&&h<5){if(t==='station')return 15; if(t==='hospital')return 10; if(['bar','pub'].includes(t))return -100;}
 return 0;
}
function run(){
 const h=new Date().getHours();
 // 1. 위수 안 전체에서 점수 계산 -> FINAL은 최고점
 let scored=FIXED.filter(f=>isInsideWisu(f.lat,f.lng)).map(f=>{const b=getBonus(f.type,h); return {...f,bonus:b,score:f.base+b+Math.random()*3};}).filter(f=>f.bonus>-50);
 scored.sort((a,b)=>b.score-a.score);
 const final=scored[0] || FIXED[0];
 // 2. 경로 후보: current->final 직선에 50개
 let cands=[];
 for(let i=0;i<50;i++){
  const t=0.12+0.78*i/49;
  let lat=cur.lat*(1-t)+final.lat*t+(Math.random()-0.5)*0.01;
  let lng=cur.lng*(1-t)+final.lng*t+(Math.random()-0.5)*0.01;
  if(!isInsideWisu(lat,lng)) continue;
  const near=FIXED.reduce((p,c)=>hav(lat,lng,p.lat,p.lng)<hav(lat,lng,c.lat,c.lng)?p:c);
  const bonus=getBonus(near.type,h);
  if(bonus<=-50) continue;
  const d=hav(cur.lat,cur.lng,lat,lng);
  const fd=hav(cur.lat,cur.lng,final.lat,final.lng);
  if(d>fd*0.96||d<1.2) continue;
  const br=bearing(cur.lat,cur.lng,lat,lng); const brF=bearing(cur.lat,cur.lng,final.lat,final.lng); let delta=Math.abs(br-brF); if(delta>180) delta=360-delta;
  const score=50+bonus+near.base*0.2+(delta<=45?30:0)-d*3+Math.random()*3;
  cands.push({lat,lng,type:near.type,name:near.name,addr:near.addr,score,d,delta});
 }
 cands.sort((a,b)=>b.score-a.score);
 // 다양성: 병원 1개까지만
 let top=[]; let hosp=0;
 for(const c of cands){
  if(c.type==='hospital'&&hosp>=1) continue;
  if(top.every(p=>hav(p.lat,p.lng,c.lat,c.lng)*1000>=500)){ top.push(c); if(c.type==='hospital') hosp++; if(top.length>=3) break; }
 }
 if(top.length<3){ top=cands.slice(0,3); }
 document.getElementById('locBar').innerText=`📍 ${cur.lat.toFixed(4)},${cur.lng.toFixed(4)} ${isInsideWisu(cur.lat,cur.lng)?'위수 안':'위수 밖'} · FINAL ${final.name}까지 ${hav(cur.lat,cur.lng,final.lat,final.lng).toFixed(1)}km`;
 document.getElementById('pipeline').innerText=`MODE${cur.mode} · FINAL 최고점수 ${final.name} ${Math.round(final.score)}점 · 위수 안 ${scored.length}곳 중 선정 · 길목 ${top.length}곳 · ⏰ ${h}시`;
 document.getElementById('timeBadge').innerText=`500m 분리 · ${h}시 기준 · ${h>=10&&h<16?'hospital|mart|apartment':'bar|pub|karaoke'}`;
 const wrap=document.getElementById('cards'); wrap.innerHTML='';
 top.forEach((c,i)=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="flex justify-between"><div class="flex gap-2 items-center"><span class="w-7 h-7 rounded-full bg-[#FFC800] text-[#121212] font-black flex items-center justify-center text-[13px]">${i+1}</span><span class="font-black text-[17px]">${c.name}</span></div><span class="text-[#FFC800] font-mono text-[12px] font-bold">${c.d.toFixed(1)}km · ${Math.round(c.score)}점</span></div><div class="text-[#A0A0A0] text-[13px] mt-1">${c.addr}</div><div class="mt-2"><span class="text-[11px] bg-[#2A2A2A] px-2 py-1 rounded-full">#${c.type}</span></div><button class="w-full mt-3 h-11 rounded-xl bg-[#2A2A2A] border border-[#333] font-bold" onclick="copyAddr('${c.addr}')">[복사] 주소만 복사</button>`;
  wrap.appendChild(el);
 });
 const f=document.createElement('div'); f.className='card final';
 f.innerHTML=`<div class="flex gap-2 items-center"><span class="w-7 h-7 rounded-full bg-[#FF6B00] text-white font-black flex items-center justify-center text-[12px]">F</span><span class="font-black text-[18px]">FINAL ${final.name} ${hav(cur.lat,cur.lng,final.lat,final.lng).toFixed(1)}km</span></div><div class="text-[#A0A0A0] text-[13px] mt-1">${final.addr} · ${Math.round(final.score)}점 · 위수 안 최고점수</div><button class="w-full mt-3 h-11 rounded-xl bg-[#FFC800] text-[#121212] font-black" onclick="copyAddr('${final.addr}')">[복사] FINAL 복사</button>`;
 wrap.appendChild(f);
}
function copyAddr(t){navigator.clipboard.writeText(t);const to=document.getElementById('toast');to.innerText='📋 복사됨: '+t;to.classList.remove('hidden');setTimeout(()=>to.classList.add('hidden'),2000);}
function doSearch(){
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{cur.lat=p.coords.latitude;cur.lng=p.coords.longitude;cur.time=Date.now();run();},e=>run(),{enableHighAccuracy:true,timeout:12000,maximumAge:0});}else run();
}
document.getElementById('searchBtn').onclick=doSearch;
document.getElementById('mode1').onclick=function(){cur.mode=1;this.className='pill btn-yellow';document.getElementById('mode2').className='pill btn-gray';run();};
document.getElementById('mode2').onclick=function(){cur.mode=2;this.className='pill btn-yellow';document.getElementById('mode1').className='pill btn-gray';run();};
doSearch();
</script>
</body>
</html>
