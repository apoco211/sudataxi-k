<script>
function openKakaoNaviApp(name, lat, lng){
  try{navigator.clipboard.writeText(name);}catch(e){}
  const q=encodeURIComponent(name);
  const pos= lat&&lng ? `&p=${lat},${lng}` : '';
  const urls=[
    `kakaonavi://search?q=${q}${pos}`,
    `kakaomap://search?q=${q}${pos}`,
    `intent://search?q=${q}${pos}#Intent;scheme=kakaomap;package=net.daum.android.map;end`,
    `https://map.kakao.com/link/search/${q}`
  ];
  let i=0;
  function tryNext(){
    if(i>=urls.length) return;
    window.location.href=urls[i];
    i++;
    if(i<3) setTimeout(tryNext,600);
  }
  tryNext();
  const t=document.createElement('div'); t.textContent='복사됨 + 카카오내비 실행'; t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:999px;z-index:9999;font-size:13px'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
function copyOnly(name){
  try{navigator.clipboard.writeText(name);}catch(e){}
  const t=document.createElement('div'); t.textContent=name+' 복사됨'; t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:999px;z-index:9999;font-size:13px'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
</script>
