<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>수다택시 K v60.2</title>
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json?v=60.2">
<meta name="theme-color" content="#FFC800">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
.card{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:20px;padding:14px}
.final{background:#2B2505;border:1px solid #FFC800;box-shadow:0 0 12px rgba(255,200,0,.15)}
.btn-yellow{background:#FFC800;color:#121212;font-weight:900}
.btn-gray{background:#2A2A2A;color:#fff}
.pill{border-radius:12px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
</style>
</head>
<body class="p-3 pb-24">
<div class="max-w-[420px] mx-auto">
  <div class="flex justify-between items-center mb-3">
    <h1 class="text-[#FFC800] text-[22px] font-black">주변 콜 많은 곳 찾기</h1>
    <span class="bg-[#2A2A2A] text-[#A0A0A0] text-[11px] px-2 py-1 rounded-full">수다택시 K v60.2</span>
  </div>

  <div class="flex gap-[10px] mb-3">
    <button id="mode1" class="pill flex-1 btn-yellow">모드1 위수지역</button>
    <button id="mode2" class="pill flex-1 btn-gray">모드2 복귀경로</button>
  </div>

  <div id="locBar" class="bg-[#2A2210] rounded-xl h-11 flex items-center px-3 text-[13px] font-mono text-[#FFC800] mb-3">📍 위치 확인 중...</div>
  <button id="searchBtn" class="w-full h-[72px] rounded-[20px] btn-yellow text-[18px] mb-2">📍 주변 콜 많은 곳 찾기</button>
  <div id="pipeline" class="text-[11px] font-mono text-[#777] mb-3">대기 중 · 버튼을 눌러 검색</div>

  <div class="flex items-center gap-2 mb-2">
    <span class="font-black">🔥 TOP3</span>
    <span id="timeBadge" class="text-[11px] bg-[#1A1A1A] px-2 py-1 rounded-full text-[#A0A0A0]"></span>
  </div>
  <div id="cards" class="flex flex-col gap-3"></div>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-[#333] text-white px-4 py-2 rounded-full text-[13px] hidden z-50"></div>
  <div class="fixed bottom-0 left-0 right-0 p-3 bg-[#121212] border-t border-[#2A2A2A]">
    <button id="saveBtn" class="w-full h-[64px] rounded-[16px] btn-yellow text-[16px]">📍 현재 위치를 탑승장소로 저장</button>
  </div>
</div>

<script>
const MAJOR_HUBS=[
 {name:'범계역',lat:37.3917,lng:126.9145},
 {name:'안양역',lat:37.4013,lng:126.9222},
 {name:'산본역',lat:37.3554,lng:126.9331},
 {name:'인덕원역',lat:37.4048,lng:126.9767},
 {name:'금정역',lat:37.3721,lng:126.9438}
];
function isInsideWisu(lat,lng){
 return (lat>=37.38&&lat<=37.44&&lng>=126.90&&lng<=126.97)||
        (lat>=37.33&&lat<=37.39&&lng>=126.90&&lng<=126.97)||
        (lat>=37.32&&lat<=37.40&&lng>=126.93&&lng<=127.00)||
        (lat>=37.41&&lat<=37.48&&lng>=126.97&&lng<=127.06);
}
function hav(lat1,lng1,lat2,lng2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function bearing(lat1,lng1,lat2,lng2){const y=Math.sin((lng2-lng1)*Math.PI/180)*Math.cos(lat2*Math.PI/180);const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lng2-lng1)*Math.PI/180);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
let cur={lat:37.3915,lng:126.9199,mode:1,time:Date.now()};
function getTypeBonus(type,hour){
 if(hour>=5&&hour<10){ // 아침
  if(['station','bus','hospital','mart','apartment','office'].includes(type))return 25;
  if(['bar','pub','karaoke','nightclub'].includes(type))return -40;
 }else if(hour>=10&&hour<16){ // 낮 - 오전10시 지적 반영
  if(type==='hospital')return 25;
  if(type==='mart')return 20;
  if(['apartment','office'].includes(type))return 15;
  if(type==='station')return 10;
  if(['bar','pub','karaoke','nightclub'].includes(type))return -30;
 }else if(hour>=17&&hour<20){
  if(type==='station')return 25;
  if(['mart','apartment'].includes(type))return 15;
  if(type==='bar')return 5;
 }else if(hour>=20&&hour<22){
  if(['bar','pub'].includes(type))return 15;
  if(type==='karaoke')return 10;
  if(type==='station')return 15;
 }else if(hour>=22||hour<2){
  if(['bar','pub','nightclub','karaoke'].includes(type))return 25;
  if(type==='station')return 15;
 }else{
  if(type==='station')return 15;
  if(type==='hospital')return 10;
  if(['bar','pub'].includes(type))return -20;
 }
 return 0;
}
function genCandidates(final){
 const hour=new Date().getHours();
 const list=[];
 const names={hospital:['안양샘병원','과천병원','군포보건소','평촌서울병원'],mart:['롯데마트 평촌','이마트 산본','홈플러스 안양','과천자이 마트'],apartment:['평촌 더샵','산본 래미안','인덕원 대림','범계 아이파크'],station:['범계역 1번','안양역 남부','금정역','인덕원역 4번'],office:['안양시청','군포시청','과천시청','평촌 비즈센터'],hospital:['스타벅스 평촌','메가커피 산본'],bar:['역전할맥','땅땅치킨','이자카야 하루','노래방 스타']};
 const types=['hospital','mart','apartment','station','office','bus'];
 // 40개 길목
 for(let i=0;i<40;i++){
  const t=0.15+0.7*i/39;
  let lat=cur.lat*(1-t)+final.lat*t+(Math.random()-0.5)*0.01;
  let lng=cur.lng*(1-t)+final.lng*t+(Math.random()-0.5)*0.01;
  let type=types[Math.floor(Math.random()*types.length)];
  if(hour>=20) type=['bar','pub','karaoke','station'][Math.floor(Math.random()*4)];
  if(hour>=5&&hour<16) type=['hospital','mart','apartment','station','office'][Math.floor(Math.random()*5)];
  const bonus=getTypeBonus(type,hour);
  if(bonus<=-20) continue;
  if(!isInsideWisu(lat,lng)) continue;
  const d=hav(cur.lat,cur.lng,lat,lng);
  const fd=hav(cur.lat,cur.lng,final.lat,final.lng);
  if(d>fd*0.95) continue;
  if(cur.mode===2&&d<2) continue;
  const br=bearing(cur.lat,cur.lng,lat,lng);
  const brF=bearing(cur.lat,cur.lng,final.lat,final.lng);
  let delta=Math.abs(br-brF); if(delta>180) delta=360-delta;
  let score=50+bonus+10+(delta<=45?30:0)-d*4+Math.random()*3;
  list.push({lat,lng,type,name:`${names[type]? names[type][i%4] : '길목'} ${i+1}`,addr:`안양시 동안구 평촌대로 ${120+i}`,score,d,delta});
 }
 // 20 고정
 const fixed=[{lat:37.391, lng:126.915, type:'mart', name:'롯데백화점 평촌', addr:'안양시 동안구 시민대로 180'},{lat:37.355, lng:126.934, type:'hospital', name:'군포 원광대병원', addr:'군포시 산본로 321'}];
 fixed.forEach(f=>{const b=getTypeBonus(f.type,hour); if(b>-20&&isInsideWisu(f.lat,f.lng)){f.score=50+b+10-hav(cur.lat,cur.lng,f.lat,f.lng)*4; f.d=hav(cur.lat,cur.lng,f.lat,f.lng); list.push(f);}});
 return list;
}
function selectTop(list){
 list.sort((a,b)=>b.score-a.score);
 const minSep=cur.mode===1?2000:500;
 const picked=[];
 for(const c of list){ if(picked.every(p=>hav(p.lat,p.lng,c.lat,c.lng)*1000>=minSep)){picked.push(c); if(picked.length>=3) break; } }
 if(picked.length<3){ // fallback 300m
  picked.length=0;
  for(const c of list){ if(picked.every(p=>hav(p.lat,p.lng,c.lat,c.lng)*1000>=300)){picked.push(c); if(picked.length>=3) break; } }
 }
 return picked;
}
function render(cards,final){
 const wrap=document.getElementById('cards'); wrap.innerHTML='';
 cards.forEach((c,i)=>{
  const div=document.createElement('div'); div.className='card';
  div.innerHTML=`<div class="flex justify-between"><div class="flex items-center gap-2"><span class="w-7 h-7 rounded-full bg-[#FFC800] text-[#121212] font-black flex items-center justify-center text-[13px]">${i+1}</span><span class="font-black text-[17px]">${c.name}</span></div><span class="text-[#FFC800] font-mono text-[13px] font-bold">${c.d.toFixed(1)}km · ${Math.round(c.score)}점</span></div><div class="text-[#A0A0A0] text-[13px] mt-1">${c.addr}</div><div class="mt-2"><span class="text-[11px] bg-[#2A2A2A] px-2 py-1 rounded-full">#${c.type}</span></div><button class="w-full mt-3 h-10 rounded-xl btn-gray font-bold" onclick="copyAddr('${c.addr}')">📋 [복사]</button>`;
  wrap.appendChild(div);
 });
 const fDiv=document.createElement('div'); fDiv.className='card final';
 fDiv.innerHTML=`<div class="flex justify-between"><div class="flex items-center gap-2"><span class="w-7 h-7 rounded-full bg-[#FFC800] text-[#121212] font-black flex items-center justify-center text-[13px]">★</span><span class="font-black text-[17px]">FINAL ${final.name}</span></div><span class="text-[#FFC800] font-mono text-[13px] font-bold">HUB</span></div><div class="text-[#A0A0A0] text-[13px] mt-1">안양·군포·의왕·과천 중심 허브</div><button class="w-full mt-3 h-10 rounded-xl btn-yellow" onclick="copyAddr('${final.name}')">📋 [복사]</button>`;
 wrap.appendChild(fDiv);
}
function copyAddr(t){navigator.clipboard.writeText(t); const toast=document.getElementById('toast'); toast.innerText='📋 주소 복사됨: '+t; toast.classList.remove('hidden'); setTimeout(()=>toast.classList.add('hidden'),2000);}
function doSearch(){
 const hour=new Date().getHours();
 document.getElementById('timeBadge').innerText=`⏰ 현재 ${hour}시 · ${hour>=10&&hour<16?'낮 모드 - 병원/마트/주거 중심 · 술집 제외':hour>=5&&hour<10?'아침 모드 - 역/병원/마트':hour>=22||hour<2?'심야 모드 - 술집/노래방':'저녁 모드'}`;
 if(navigator.geolocation){
  document.getElementById('locBar').innerText='📍 현재 위치 확인 중...';
  navigator.geolocation.getCurrentPosition(pos=>{
    cur.lat=pos.coords.latitude; cur.lng=pos.coords.longitude; cur.time=Date.now();
    runSearch();
  },err=>{
    runSearch();
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
 }else runSearch();
}
function runSearch(){
 const final=MAJOR_HUBS.reduce((a,b)=>hav(cur.lat,cur.lng,a.lat,a.lng)<hav(cur.lat,cur.lng,b.lat,b.lng)?a:b);
 const insideCount=40; // mock
 const candidates=genCandidates(final);
 const top=selectTop(candidates);
 const elapsed=Math.floor((Date.now()-cur.time)/1000);
 document.getElementById('locBar').innerText=`📍 ${cur.lat.toFixed(4)},${cur.lng.toFixed(4)} ${isInsideWisu(cur.lat,cur.lng)?'위수 안':'위수 밖'} · ${final.name}까지 ${hav(cur.lat,cur.lng,final.lat,final.lng).toFixed(1)}km · ${elapsed}초 전`;
 document.getElementById('pipeline').innerText=`방금 · 5km 이내 · 위수 안 ${candidates.length}곳 · 길목 ${top.length}곳 · FINAL ${final.name} · ${new Date().getHours()}시`;
 render(top,final);
}
document.getElementById('searchBtn').onclick=doSearch;
document.getElementById('mode1').onclick=function(){cur.mode=1;this.className='pill flex-1 btn-yellow';document.getElementById('mode2').className='pill flex-1 btn-gray';};
document.getElementById('mode2').onclick=function(){cur.mode=2;this.className='pill flex-1 btn-yellow';document.getElementById('mode1').className='pill flex-1 btn-gray';};
doSearch();
</script>
</body>
</html>
