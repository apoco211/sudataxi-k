<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>수다택시 K v60.28</title>
<meta name="theme-color" content="#FFC800">
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;padding-bottom:110px}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 90px}
.h{font-size:22px;font-weight:900;color:#FFC800;text-align:center;padding:12px 0 10px}
.pills{display:flex;gap:8px;margin:8px 0}
.pill{flex:1;height:38px;border-radius:12px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #2A2A2A}
.pill.active{background:#FFC800;color:#000;border-color:#FFC800}
.pill.inactive{background:#2A2A2A;color:#8A8A8A}
.loc{height:44px;background:#2A2210;border:1px solid #3A2E0A;border-radius:12px;display:flex;align-items:center;padding:0 14px;font-size:13px;font-family:monospace;color:#FFC800;margin:8px 0;overflow:hidden;white-space:nowrap}
.big{height:72px;background:#FFC800;color:#000;border-radius:20px;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:10px 0;box-shadow:0 4px 20px rgba(255,200,0,.3)}
.big:active{transform:scale(.97)}
.pipe{font-size:11px;font-family:monospace;color:#8A8A8A;margin:6px 0 12px;white-space:pre-wrap}
.sec{font-size:18px;font-weight:900;margin:14px 0 8px}
.card{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:20px;padding:14px;display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.card.final1{background:#2B2505;border-color:#FFC800;box-shadow:0 0 20px rgba(255,200,0,.15)}
.card.final2{background:#2A1A0A;border-color:#FF6B00;box-shadow:0 0 20px rgba(255,107,0,.15)}
.num{width:28px;height:28px;background:#FFC800;color:#121212;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.name{font-size:19px;font-weight:900;color:#fff;margin-bottom:4px}
.meta{font-size:13px;font-family:monospace;color:#FFC800;font-weight:800}
.addr{font-size:13px;color:#A0A0A0;margin-top:2px}
.coord{font-size:11px;font-family:monospace;color:#666;margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;margin-right:4px;margin-top:4px}
.b-gil{background:#14331A;color:#4ADE80}
.b-wisu{background:#3A2F0A;color:#FFC800}
.b-log{background:#1A2A3A;color:#60A5FA}
.btn{height:44px;min-width:102px;background:#2A2A2A;border:1px solid #333;border-radius:12px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;padding:0 12px}
.btn:active{transform:scale(.96)}
.saveBar{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(18,18,18,.95);backdrop-filter:blur(8px);border-top:2px solid #FFC800;display:flex;align-items:center;justify-content:center;z-index:50;padding:0 16px}
.saveBtn{width:100%;max-width:430px;height:56px;background:#FFC800;color:#000;border-radius:16px;font-size:16px;font-weight:900;border:none;cursor:pointer}
.logCard{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:20px;padding:14px;margin:12px 0}
.smallBtn{height:32px;padding:0 12px;background:#2A2A2A;border:1px solid #333;border-radius:8px;color:#ccc;font-size:12px;margin-right:6px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="h">주변 콜 많은 곳 찾기</div>
<div class="pills">
<div id="pill1" class="pill active" onclick="setMode(1)">[모드1]</div>
<div id="pill2" class="pill inactive" onclick="setMode(2)">[모드2]</div>
</div>
<div id="loc" class="loc">📍 GPS 대기 중 - 아래 버튼을 눌러 위치 확인</div>
<div class="big" onclick="searchNow()">📍 주변 콜 많은 곳 찾기</div>
<div id="pipe" class="pipe">대기 중 · [모드1] 5역 FINAL / [모드2] 위수 핫플 FINAL</div>
<div class="sec">🔥 TOP3</div>
<div id="list"></div>
<div id="logBox" class="logCard">
<div style="display:flex;justify-content:space-between;align-items:center"><span>콜 로그·백업 (<span id="logCnt">0</span>개)</span></div>
<div style="margin-top:8px">
<button class="smallBtn" onclick="exportLogs()">내보내기</button>
<button class="smallBtn" onclick="importLogs()">가져오기</button>
<button class="smallBtn" onclick="copyLogs()">클립보드</button>
<button class="smallBtn" onclick="clearLogs()">삭제</button>
</div>
<div id="logList" style="margin-top:8px;font-size:11px;font-family:monospace;color:#888;max-height:120px;overflow:auto"></div>
</div>
</div>
<div class="saveBar"><button class="saveBtn" onclick="saveBoarding()">📍 고객 탑승 위치 저장</button></div>
<script>
const MAJOR_HUBS=[
{name:"범계역(안양중심)",lat:37.3917,lng:126.9145},
{name:"안양역(만안)",lat:37.4013,lng:126.9222},
{name:"산본역(군포)",lat:37.3554,lng:126.9331},
{name:"인덕원역(과천/안양)",lat:37.4048,lng:126.9767},
{name:"금정역(군포/안양경계)",lat:37.3721,lng:126.9438}
];
const FIXED=[
{name:"범계역 로데오거리",lat:37.3917,lng:126.9145,addr:"경기 안양시 동안구 평촌대로 221"},
{name:"평촌역 먹자골목",lat:37.3945,lng:126.9645,addr:"경기 안양시 동안구 시민대로 200"},
{name:"안양일번가",lat:37.4013,lng:126.9222,addr:"경기 안양시 만안구 안양로 304"},
{name:"인덕원역 먹자골목",lat:37.4048,lng:126.9767,addr:"경기 안양시 동안구 흥안대로 446"},
{name:"산본역 중심상가",lat:37.3554,lng:126.9331,addr:"경기 군포시 산본로 323"},
{name:"금정역 먹자골목",lat:37.3721,lng:126.9438,addr:"경기 군포시 금정동 752"},
{name:"범계역 4번출구",lat:37.3925,lng:126.916,addr:"경기 안양시 동안구 평촌대로 212"},
{name:"평촌 학원가",lat:37.389,lng:126.969,addr:"경기 안양시 동안구 관악대로 359"},
{name:"호계동 먹자골목",lat:37.383,lng:126.952,addr:"경기 안양시 동안구 경수대로 561"},
{name:"과천자이 앞",lat:37.426,lng:126.996,addr:"경기 과천시 별양로 12"},
{name:"정부과천청사역",lat:37.4275,lng:127.0,addr:"경기 과천시 관문로 47"},
{name:"의왕 내손동 먹자",lat:37.366,lng:126.966,addr:"경기 의왕시 내손동 761"},
{name:"대야미역 먹자",lat:37.333,lng:126.914,addr:"경기 군포시 대야미동"},
{name:"군포역 앞",lat:37.362,lng:126.944,addr:"경기 군포시 군포역로 22"},
{name:"안양역 앞",lat:37.401,lng:126.923,addr:"경기 안양시 만안구 석수동"}
];
function isInsideWisu(lat,lng){
if(lat>=37.38&&lat<=37.43&&lng>=126.90&&lng<=126.96) return true;
if(lat>=37.33&&lat<=37.38&&lng>=126.90&&lng<=126.96) return true;
if(lat>=37.32&&lat<=37.38&&lng>=126.93&&lng<=126.99) return true;
if(lat>=37.41&&lat<=37.45&&lng>=126.97&&lng<=127.03) return true;
return false;
}
function hav(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bearing(a,b){const dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,y=Math.sin(dLng)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLng);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
let cur=null;
let mode=1;
let callLogs=JSON.parse(localStorage.getItem('callLogs')||'[]');
let lastList=[];
function updateLocBar(){
 const el=document.getElementById('loc');
 if(!cur){el.textContent='📍 GPS 대기 중 - 아래 버튼을 눌러 위치 확인';return;}
 const inside=isInsideWisu(cur.lat,cur.lng)?'위수 안':'위수 밖';
 el.textContent=`📍 ${cur.lat.toFixed(4)},${cur.lng.toFixed(4)} · ${inside} · ±${Math.round(cur.acc)}m`;
}
function setMode(m){mode=m;document.getElementById('pill1').className=m==1?'pill active':'pill inactive';document.getElementById('pill2').className=m==2?'pill active':'pill inactive';document.querySelector('.saveBar').style.borderColor=m==1?'#FFC800':'#FF6B00';}
function timeBonus(){const h=new Date().getHours(),d=new Date().getDay();let b=0;if(h>=17&&h<=20)b+=25;if(h>=18&&h<=22)b+=15;if(h>=22||h<=2)b+=20;if(d==5||d==6)b+=10;return b;}
async function fetchOverpass(radius){
const q=`[out:json][timeout:12];node(around:${radius},${cur.lat},${cur.lng})[amenity~"bar|pub|nightclub|karaoke_box"];out 20;`;
try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});const j=await r.json();return (j.elements||[]).map(e=>({name:e.tags.name||e.tags.amenity||'술집',lat:e.lat,lng:e.lon,addr:'실시간',src:'real'}));}catch(e){return [];}
}
function scoreCandidate(c,finalDest){
let s=50;
s+=timeBonus();
if(callLogs.some(l=>hav(c,l)<0.3)) s+=20;
if(isInsideWisu(c.lat,c.lng)) s+=10;
const delta=Math.abs(bearing(cur,finalDest)-bearing(cur,c));const d2=delta>180?360-delta:delta;
if(d2<=45) s+=30;
else if(d2>=120) s-=50;
s-=hav(cur,c)*4;
s+=Math.random()*3;
return {...c, score:s, dist:hav(cur,c), delta:d2, finalDist:hav(cur,finalDest)};
}
function openKakaoMap(idx){
  const c = lastList[idx];
  if(!c) return;
  const addr = c.addr && c.addr!=='실시간'? c.addr : c.name;
  const safeName = encodeURIComponent(c.name);
  const safeAddr = encodeURIComponent(addr);
  navigator.clipboard.writeText(addr).catch(()=>{});
  if(c.addr && c.addr!=='실시간'){
    window.open(`https://map.kakao.com/link/search/${safeAddr}`, '_blank');
    setTimeout(()=>{ location.href = `kakaonavi://navigate?name=${safeName}&x=${c.lng}&y=${c.lat}&coord_type=wgs84&rp_option=2`; },400);
  } else {
    window.open(`https://map.kakao.com/link/to/${safeName},${c.lat},${c.lng}`, '_blank');
    setTimeout(()=>{ location.href = `kakaonavi://navigate?name=${safeName}&x=${c.lng}&y=${c.lat}&coord_type=wgs84&rp_option=2`; },400);
  }
}
function render(list,finalDest){
lastList = list;
const el=document.getElementById('list');el.innerHTML='';
list.forEach((c,i)=>{
const isFinal=i===list.length-1;
const div=document.createElement('div');
div.className='card '+(isFinal?(mode==1?'final1':'final2'):'');
const badges=[];
if(c.delta<=45) badges.push('<span class="badge b-gil">길목 +30</span>');
if(isInsideWisu(c.lat,c.lng)) badges.push('<span class="badge b-wisu">위수 +10</span>');
if(callLogs.some(l=>hav(c,l)<0.3)) badges.push('<span class="badge b-log">로그 +20</span>');
const remain=finalDest? (finalDest.dist - c.dist).toFixed(1):'0';
const distLine=mode==1? `현재→핫스팟 ${c.dist.toFixed(2)}km · 최종 ${finalDest.dist.toFixed(2)}km` : `현재→핫스팟 ${c.dist.toFixed(2)}km · 최종위수 ${finalDest.dist.toFixed(2)}km (${finalDest.name}까지 ${remain}km 남음)`;
div.innerHTML=`<div style="display:flex;gap:10px;flex:1"><div class="num">${isFinal?'★':i+1}</div><div style="flex:1"><div class="name">${c.name}</div><div class="meta">${c.dist.toFixed(2)}km · ${Math.round(c.score)}점</div><div class="addr">${distLine}</div><div class="addr">${c.addr||''}</div><div class="coord">${c.lat.toFixed(4)},${c.lng.toFixed(4)}</div><div>${badges.join('')}</div></div></div><button class="btn" onclick="openKakaoMap(${i})">[네비게이션]</button>`;
el.appendChild(div);
});
}
async function searchNow(){
const locEl=document.getElementById('loc');
locEl.textContent='📍 현재 위치 확인 중...';
try{
const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000,maximumAge:0}));
cur={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
}catch(e){
alert('GPS 실패 - 위치 권한을 확인해주세요');
document.getElementById('loc').textContent='📍 GPS 실패 - 다시 시도해주세요';
return;
}
updateLocBar();
const radius=mode==1?3000:10000;
let real=[];
try{real=await fetchOverpass(radius);}catch{}
const all=[...FIXED,...real.map(r=>({...r,addr:'실시간'}))];
let finalDest;
if(mode==1){
let best=null,md=1e9;
MAJOR_HUBS.forEach(h=>{const d=hav(cur,h);if(d<md){md=d;best={...h,dist:d,score:100}}});
finalDest=best;
}else{
let cands=all.filter(c=>isInsideWisu(c.lat,c.lng));
if(cands.length==0) cands=FIXED.filter(c=>isInsideWisu(c.lat,c.lng));
let best=null,md=1e9;
cands.forEach(c=>{const d=hav(cur,c);if(d<md&&d>0.2){md=d;best=c;}});
if(!best) best=MAJOR_HUBS[2];
best.dist=hav(cur,best);
finalDest=best;
}
let scored=all.map(c=>scoreCandidate(c,finalDest)).filter(c=>mode==1?c.dist<=5:c.dist>=2&&c.dist<finalDest.dist*0.95&&c.dist<=20);
if(mode==1) scored=scored.filter(c=>c.delta<=60);
else scored=scored.filter(c=>c.delta<=80);
scored.sort((a,b)=>b.score-a.score);
let selected=[];
for(let c of scored){
if(selected.every(s=>hav(c,s)>= (mode==1?2:0.5))){selected.push(c); if(selected.length>=3) break;}
}
if(selected.length<3){for(let c of scored){if(!selected.includes(c)){selected.push(c); if(selected.length>=3) break;}}}
selected.sort((a,b)=>a.dist-b.dist);
const finalList=[...selected,finalDest];
render(finalList,finalDest);
document.getElementById('pipe').textContent=`방금 · ${mode==1?'5km':'2~20km'} · ${all.length}곳 검색 · FINAL ${finalDest.name} ${finalDest.dist.toFixed(2)}km`;
}
function saveBoarding(){if(!cur){alert('먼저 검색으로 위치를 확인해주세요');return;}const entry={id:Date.now(),timestamp:new Date().toISOString(),lat:cur.lat,lng:cur.lng,placeName:'현재 위치',mode,day:new Date().getDay(),hour:new Date().getHours()};callLogs.unshift(entry);localStorage.setItem('callLogs',JSON.stringify(callLogs));updateLogBox();alert('고객 탑승 위치 저장 완료! +25점');}
function updateLogBox(){document.getElementById('logCnt').textContent=callLogs.length;document.getElementById('logList').innerHTML=callLogs.slice(0,20).map(l=>`${l.timestamp.slice(11,19)} · ${l.lat.toFixed(4)},${l.lng.toFixed(4)} · 모드${l.mode}`).join('<br>');}
function exportLogs(){const blob=new Blob([JSON.stringify(callLogs,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='callLogs.json';a.click();}
function importLogs(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=ev=>{try{const j=JSON.parse(ev.target.result);if(Array.isArray(j)){callLogs=j;localStorage.setItem('callLogs',JSON.stringify(callLogs));updateLogBox();alert('가져오기 완료');}}catch{alert('JSON 오류');}};r.readAsText(f);};inp.click();}
function copyLogs(){navigator.clipboard.writeText(JSON.stringify(callLogs)).then(()=>alert('클립보드 복사'));}
function clearLogs(){if(confirm('전체 삭제?')){callLogs=[];localStorage.setItem('callLogs','[]');updateLogBox();}}
updateLocBar();updateLogBox();
</script>
</body>
</html>
