name: Build A25 Lite APK (iPhone friendly)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew && ls -la

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: List APK
        run: find app/build -name "*.apk" -type f | xargs ls -lh || ls -R app/build/outputs/

      - name: Upload APK artifact (for iPhone download)
        uses: actions/upload-artifact@v4
        with:
          name: SudaTaxi-A25-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30