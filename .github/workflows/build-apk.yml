name: Build A25 Lite APK (BYPASS WRAPPER - FINAL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.0 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.0

      - name: Delete corrupted wrapper (bypass it)
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/ || true
          cat gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Debug APK with system gradle (not wrapper)
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SudaTaxi-A25-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30