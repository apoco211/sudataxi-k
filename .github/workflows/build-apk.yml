name: Build A25 Lite APK (FINAL - no setup-gradle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix wrapper jar
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ls -lh gradle/wrapper/
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SudaTaxi-A25-Lite-APK
          path: app/build/outputs/apk/debug/*.apk