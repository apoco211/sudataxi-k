name: Build A25 Lite APK (FINAL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.0 (must be 8.0 not 8)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.0

      - name: Fix wrapper - download jar if missing + regenerate
        run: |
          ls -la gradle/wrapper/ || true
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          fi
          gradle wrapper --gradle-version 8.0
          chmod +x ./gradlew
          ls -lh gradle/wrapper/ ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SudaTaxi-A25-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30