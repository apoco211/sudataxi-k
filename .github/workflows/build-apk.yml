name: Build A25 Lite APK (FINAL - fix jar)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix wrapper jar (force fresh download)
        run: |
          echo "=== before ==="
          ls -la gradle/wrapper/ || true
          echo "Removing any corrupted jar"
          rm -f gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          echo "Downloading fresh wrapper jar 8.0"
          curl -L --fail -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          echo "=== after download ==="
          ls -lh gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar || true
          SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "jar size: $SIZE"
          if [ "$SIZE" -lt 50000 ]; then
            echo "jar too small, trying alternative URL"
            curl -L --fail -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
            ls -lh gradle/wrapper/
          fi

      - name: Ensure wrapper properties is 8.0
        run: |
          cat gradle/wrapper/gradle-wrapper.properties || true
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SudaTaxi-A25-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30